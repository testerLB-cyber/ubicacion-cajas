name: renta-manual-exit
on:
  push:
    paths:
      - '.github/workflows/zz-renta-manual-exit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_renta_manual.py
      - name: Verify and commit
        run: |
          grep -Fq 'VENCIDA · EN RENTA' app-correcta.html
          grep -Fq 'Fecha real de salida' app-correcta.html
          grep -Fq 'La fecha fin es vencimiento programado' app-correcta.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-correcta.html
          git commit -m 'Mantiene rentas vencidas activas hasta salida manual'
          git push
