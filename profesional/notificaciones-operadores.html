<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones a Operadores · Tráfico App</title><style>
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a}.top{background:#0f172a;color:#fff;padding:18px}.top a{color:#93c5fd;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:11px;font-weight:800;color:#475569;display:block;margin-bottom:6px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.ops{max-height:330px;overflow:auto;border:1px solid #e2e8f0;border-radius:12px}.op{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #eef2f7;align-items:center}.op input{width:auto}.btn{border:0;background:#2563eb;color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.btn.gray{background:#e2e8f0;color:#334155}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.msg{margin-top:10px;font-size:12px}.bad{color:#b91c1c}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="top"><b>Tráfico App · Notificaciones a operadores</b><div style="font-size:12px;margin-top:5px"><a href="./">← Regresar a Control Logístico</a></div></div><main class="wrap"><div class="card"><div class="row"><div><h2 style="margin:0">Nueva notificación</h2><p style="color:#64748b">Envía un aviso a uno, varios o todos los operadores móviles.</p></div><button class="btn gray" id="all">Seleccionar todos</button></div><div class="grid"><div><label>TÍTULO</label><input id="title" maxlength="120" placeholder="Ej. Aviso de operación"></div><div><label>PRIORIDAD / ORIGEN</label><select id="source"><option>OPERACION</option><option>TRAFICO</option><option>MANTENIMIENTO</option><option>ADMINISTRACION</option><option>URGENTE</option></select></div></div><div style="margin-top:12px"><label>MENSAJE</label><textarea id="body" rows="4" maxlength="1200" placeholder="Escribe el mensaje que recibirá el operador"></textarea></div></div>
<div class="card"><div class="row"><b>Destinatarios</b><span id="count">0 seleccionados</span></div><div id="ops" class="ops" style="margin-top:12px">Cargando operadores…</div></div><button class="btn" id="send">Enviar notificación</button><div id="msg" class="msg"></div></main>
<script src="assets/js/vendor/supabase-sdk.js"></script><script>
const sb=window.supabase.createClient('https://nbogdhriavzqetnlrrau.supabase.co','sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy',{auth:{persistSession:true,autoRefreshToken:true}}),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];
function updateCount(){$('count').textContent=document.querySelectorAll('.op input:checked').length+' seleccionados'}
async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href='./';return}const r=await sb.rpc('cc_operator_notification_directory');if(r.error||!r.data?.ok){$('ops').innerHTML='<div class="op bad">No tienes permiso para enviar notificaciones.</div>';return}rows=r.data.operadores||[];$('ops').innerHTML=rows.map(x=>'<label class="op"><input type="checkbox" value="'+esc(x.user_id)+'"><span><b>'+esc(x.operador_nombre||x.nombre)+'</b><br><small>'+esc(x.nombre||'')+'</small></span></label>').join('');document.querySelectorAll('.op input').forEach(x=>x.onchange=updateCount)}
$('all').onclick=()=>{const xs=[...document.querySelectorAll('.op input')],on=xs.some(x=>!x.checked);xs.forEach(x=>x.checked=on);updateCount()};
$('send').onclick=async()=>{const ids=[...document.querySelectorAll('.op input:checked')].map(x=>x.value),title=$('title').value.trim(),body=$('body').value.trim();$('msg').className='msg';if(!ids.length||!title||!body){$('msg').className='msg bad';$('msg').textContent='Selecciona destinatarios y captura título y mensaje.';return}$('send').disabled=true;$('msg').textContent='Enviando…';const r=await sb.rpc('cc_send_operator_notification',{p_user_ids:ids,p_title:title,p_body:body,p_url:'/operador-v2/',p_source:$('source').value});if(r.error){$('send').disabled=false;$('msg').className='msg bad';$('msg').textContent=r.error.message;return}const push=await sb.functions.invoke('operator-web-push',{body:{action:'send',userIds:ids,title,message:body,url:'/operador-v2/'}});$('send').disabled=false;if(push.error){$('msg').className='msg bad';$('msg').textContent='Aviso guardado, pero Push falló: '+push.error.message;return}$('msg').textContent='Listo: '+(r.data?.enviadas||0)+' avisos · '+(push.data?.sent||0)+' Push entregados al servicio.';$('body').value='';};init();
</script></body></html>
