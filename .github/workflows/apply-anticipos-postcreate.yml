name: Aplicar correccion final Anticipos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_anticipos_postcreate_ui.py'
      - '.github/workflows/apply-anticipos-postcreate.yml'
  workflow_run:
    workflows: ['Construir version profesional paralela']
    types: [completed]

permissions:
  contents: write

jobs:
  aplicar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar post-create comun Operador Beneficiario
        run: python3 .github/scripts/fix_anticipos_postcreate_ui.py
      - name: Validar flujo final de Anticipos
        run: |
          grep -q 'Post-create común Operador/Beneficiario v3' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'ccAntPostCreateComun' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'ccAntTipoPersonaSwitch' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'ccAntPendTipoPersonaSwitch' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'ccAntChooseTypeFinal=chooseType' profesional/assets/js/modules/anticipos-profesional-flow.js
      - name: Publicar correccion final Anticipos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/assets/js/modules/anticipos-profesional-flow.js
          if git diff --cached --quiet; then
            echo "Correccion de Anticipos ya aplicada"
            exit 0
          fi
          git commit -m "Corregir flujo final de Anticipos"
          git push
