name: Construir version profesional paralela

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app-correcta.html'
      - 'anticipo-operador.html'
      - 'comprobacion-anticipo-completa.html'
      - 'comprobar-anticipo.html'
      - 'ubicacion.html'
      - 'vendor/**'
      - '.github/scripts/build_professional.py'
      - '.github/scripts/add_professional_runtime.py'
      - '.github/scripts/add_anticipos_comprobantes_ui.py'
      - '.github/scripts/add_anticipos_caja_chica_ui.py'
      - '.github/scripts/add_anticipos_cuentas_corrected_ui.py'
      - '.github/scripts/add_anticipos_catalogos_cleanup_ui.py'
      - '.github/scripts/add_anticipos_cuentas_catalogo_kpis_ui.py'
      - '.github/scripts/add_anticipos_utilerias_ui.py'
      - '.github/scripts/add_service_sheets_module.py'
      - '.github/scripts/run_service_sheets_module.py'
      - '.github/scripts/add_service_sheets_comprobacion_v2.py'
      - '.github/scripts/add_service_sheets_control_dashboard.py'
      - '.github/scripts/add_service_sheets_comprobacion_v4.py'
      - '.github/scripts/add_user_notifications_ui.py'
      - '.github/workflows/create-professional-copy.yml'

permissions:
  contents: write

jobs:
  build-profesional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir version paralela
        run: python3 .github/scripts/build_professional.py

      - name: Agregar runtime modular
        run: python3 .github/scripts/add_professional_runtime.py

      - name: Agregar gestion de comprobantes
        run: python3 .github/scripts/add_anticipos_comprobantes_ui.py

      - name: Agregar soporte base de responsables y cuentas
        run: python3 .github/scripts/add_anticipos_caja_chica_ui.py

      - name: Corregir modelo a cuentas y beneficiarios
        run: python3 .github/scripts/add_anticipos_cuentas_corrected_ui.py

      - name: Integrar responsables y comprobantes en catalogos
        run: python3 .github/scripts/add_anticipos_catalogos_cleanup_ui.py

      - name: Consolidar cuentas y KPIs por cuenta
        run: python3 .github/scripts/add_anticipos_cuentas_catalogo_kpis_ui.py

      - name: Agregar utilerias de carga historica
        run: python3 .github/scripts/add_anticipos_utilerias_ui.py

      - name: Agregar Control de Hojas de Servicio
        run: python3 .github/scripts/run_service_sheets_module.py

      - name: Agregar responsables y comprobación de Hojas de Servicio
        run: python3 .github/scripts/add_service_sheets_comprobacion_v2.py

      - name: Agregar tablero de rastreo de Hojas de Servicio
        run: python3 .github/scripts/add_service_sheets_control_dashboard.py

      - name: Ajustar comprobación final con cliente y servicio
        run: python3 .github/scripts/add_service_sheets_comprobacion_v4.py

      - name: Agregar notificaciones por usuario
        run: python3 .github/scripts/add_user_notifications_ui.py

      - name: Validar respaldo exacto
        run: cmp -s app-correcta.html profesional/source-original.html

      - name: Validar runtime profesional
        run: |
          test -f profesional/assets/js/core/module-registry.js
          test -f profesional/assets/js/core/health-check.js
          test -f profesional/module-contracts.json
          test -f profesional/assets/js/modules/service-sheets.js
          test -f profesional/hojas-servicio-aceptar.html
          grep -q 'profesional-modular-v4' profesional/index.html
          grep -q 'Gestión de comprobantes desde Comprobar y listado' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'Modelo corregido: cuentas + operador/responsable' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'Responsables y tipos de comprobante dentro de Catálogos' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'Cuenta única en Catálogos + KPIs por cuenta' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'Utilerías de carga histórica de anticipos' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'Control de Hojas de Servicio · v1' profesional/assets/js/modules/service-sheets.js
          grep -q 'Hojas de Servicio v2 · responsables + comprobación' profesional/assets/js/modules/service-sheets.js
          grep -q 'Hojas de Servicio v3 · tablero de control' profesional/assets/js/modules/service-sheets.js
          grep -q 'Hojas de Servicio v4 · comprobación final cliente + servicio' profesional/assets/js/modules/service-sheets.js
          grep -q "\['comprobar','Comprobar uso / devolución'\]" profesional/assets/js/security/auth-permissions.js
          grep -q "hojas_servicio','Control de Hojas de Servicio" profesional/assets/js/security/auth-permissions.js
          grep -q 'Notificaciones por usuario + comprobaciones por enlace' profesional/assets/js/modules/alerts-center.js
          grep -q "\['notificaciones','Notificaciones'" profesional/assets/js/security/auth-permissions.js

      - name: Publicar solo carpeta profesional
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional
          if git diff --cached --quiet; then
            echo "Sin cambios en version profesional"
            exit 0
          fi
          git commit -m "Actualizar version profesional modular"
          git push
