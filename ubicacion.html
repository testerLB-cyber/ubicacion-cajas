<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Ubicación de unidad · Tráfico App</title>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var token=(p.get('token')||p.get('q')||p.get('t')||'').trim();
  var url='unidad-ubicacion.html'+(token?'?token='+encodeURIComponent(token):'');
  location.replace(url);
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">Abriendo actualización de ubicación…</body>
</html>
