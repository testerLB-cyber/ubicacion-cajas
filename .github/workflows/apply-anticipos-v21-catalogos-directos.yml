name: Aplicar Anticipos v21 Catalogos Directos

on:
  push:
    paths:
      - 'profesional/assets/js/modules/anticipos-v21-catalogos-directos.js'
      - '.github/workflows/apply-anticipos-v21-catalogos-directos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validar JavaScript
        run: node --check profesional/assets/js/modules/anticipos-v21-catalogos-directos.js
      - name: Activar vista v21 y retirar capas conflictivas
        shell: python
        run: |
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text(encoding='utf-8')
          old=[
            '<script src="assets/js/modules/anticipos-v17-catalogos-inline-lock.js?v=v17"></script>',
            '<script src="assets/js/modules/anticipos-v18-formularios-inline-visible.js?v=v18"></script>',
            '<script src="assets/js/modules/anticipos-v20-catalogos-form-hotfix.js?v=v20"></script>'
          ]
          for tag in old:
              s=s.replace(tag+'\n','').replace(tag,'')
          tag='<script src="assets/js/modules/anticipos-v21-catalogos-directos.js?v=v21"></script>'
          s=s.replace(tag+'\n','').replace(tag,'')
          anchor='<script src="assets/js/modules/anticipos-v19-cajas-historial.js?v=v19"></script>'
          if anchor not in s:
              anchor='<script src="assets/js/modules/anticipos-v16-cajas.js?v=v16"></script>'
          if anchor not in s:
              raise SystemExit('No se encontro ancla de Anticipos')
          s=s.replace(anchor,anchor+'\n'+tag,1)
          if s.count('anticipos-v21-catalogos-directos.js') != 1:
              raise SystemExit('Carga v21 incorrecta')
          for name in ['anticipos-v17-catalogos-inline-lock.js','anticipos-v18-formularios-inline-visible.js','anticipos-v20-catalogos-form-hotfix.js']:
              if name in s:
                  raise SystemExit('Sigue activa capa conflictiva: '+name)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activar Catalogos directos Anticipos v21"
          git push
