name: Bust config print v21 once
on:
  push:
    paths:
      - '.github/workflows/bust-config-print-v21-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force fresh Impresion v2.1
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text()
          old='assets/js/modules/configuracion-impresion-v2.js?v=20260913-0125'
          new='assets/js/modules/configuracion-impresion-v2.js?v=20260913-0134'
          if old not in s:
              raise SystemExit('No se encontró referencia anterior')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/index.html
          git commit -m 'Configuración impresión: forzar carga v2.1 sin qr null'
          git push origin HEAD:main
