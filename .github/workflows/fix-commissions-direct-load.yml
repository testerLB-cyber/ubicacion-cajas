name: Fix commissions direct load
on:
  push:
    paths:
      - '.github/workflows/fix-commissions-direct-load.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch professional index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          script='<script src="assets/js/modules/commissions-liquidations.js?v=20260914-direct-1" data-cc-commissions-direct="1"></script>\n'
          if 'data-cc-commissions-direct' not in s:
              s=s.replace(marker, script+marker)
          s=s.replace('assets/js/core/module-registry.js"','assets/js/core/module-registry.js?v=20260914-direct-1"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Carga directa de tarifas comisiones y liquidaciones'
            git push
          fi