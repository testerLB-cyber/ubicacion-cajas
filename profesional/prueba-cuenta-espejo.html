<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Prueba · Pantalla Aeropuerto · Cuenta Espejo</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{margin:0;background:#f1f5f9;font:14px Arial,sans-serif;color:#0f172a}#top{padding:13px 22px;background:#0f172a;color:white;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#top strong{font-size:16px}button{cursor:pointer}#login{max-width:440px;margin:45px auto;padding:26px;background:white;border-radius:15px;box-shadow:0 10px 32px #0001}#login input{display:block;width:100%;box-sizing:border-box;padding:11px;margin:8px 0 16px;border:1px solid #cbd5e1;border-radius:9px}#login button,.topbtn{padding:10px 16px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700}#status{padding:9px 20px;background:#dbeafe;display:none}#ccPanelPantallaAeropuerto{display:none;padding:12px}#ccPanelPantallaAeropuerto.active{display:block}#airManualPanel,#airMirrorModal,#airCreateAccounts,#airMirrorOpen,#airDemorasBtn,#airHistoryBtn{display:none!important}</style></head><body><div id="top"><div><strong>TRÁFICO APP · PANTALLA AEROPUERTO</strong><span style="margin-left:14px;font-size:12px;color:#bfdbfe">PRUEBA CUENTA ESPEJO · SOLO CONSULTA</span></div><button class="topbtn" id="logout">Cerrar sesión</button></div><div id="status"></div><section id="login"><h2>Cuenta Espejo</h2><p>Inicia sesión con la cuenta externa del cliente para ver la misma Pantalla Aeropuerto.</p><label>Correo<input id="email" type="email" autocomplete="email"></label><label>Contraseña<input id="pass" type="password" autocomplete="current-password"></label><button id="signIn">Ingresar</button><p id="loginError" style="color:#b91c1c"></p><p style="font-size:12px;color:#64748b">La contraseña se crea desde el enlace de activación recibido por correo.</p></section><main id="ccPanelPantallaAeropuerto"><div id="ccPantallaAeropuertoMount"></div></main><script src="assets/js/vendor/supabase-sdk.js"></script><script src="assets/js/config/supabase-config.js"></script><script>window.CC_MIRROR_EXTERNAL=true;window.gmSupabase=window.supabase.createClient(window.GM_SUPABASE_URL,window.GM_SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:false,autoRefreshToken:true}});window.CC_ACCESS={superAdmin:false,rol:'ESPEJO'};</script><script src="assets/js/modules/pantalla-aeropuerto.js?v=20261009-espejo-prueba01"></script><script>(async()=>{const $=id=>document.getElementById(id),sb=window.gmSupabase;let started=false;async function boot(){const {data:{session}}=await sb.auth.getSession();$('login').style.display=session?'none':'block';$('logout').style.display=session?'inline-block':'none';if(session){if(!started){started=true;window.ccMirrorAirportStart()}else document.getElementById('ccPanelPantallaAeropuerto').classList.add('active')}else document.getElementById('ccPanelPantallaAeropuerto').classList.remove('active')}$('signIn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error){$('loginError').textContent=error.message;return}await boot()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};await boot()})().catch(e=>{document.getElementById('loginError').textContent=e.message});</script></body></html>
