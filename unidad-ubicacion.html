<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta name="theme-color" content="#0f172a">
<title>Actualizar ubicación · Tráfico App</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef2f7;color:#0f172a;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(520px,100%);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.16)}.head{padding:22px;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff}.head h1{margin:0;font-size:21px}.head p{margin:5px 0 0;color:#bfdbfe;font-size:12px}.body{padding:20px}.unit{border:1px solid #bfdbfe;background:#eff6ff;border-radius:14px;padding:14px;margin-bottom:14px}.unit strong{display:block;font-size:20px}.unit span{display:block;margin-top:4px;font-size:12px;color:#475569}.status{padding:15px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;text-align:center;font-size:14px;font-weight:800;line-height:1.45}.status.ok{background:#dcfce7;border-color:#86efac;color:#166534}.status.err{background:#fee2e2;border-color:#fecaca;color:#991b1b}.retry{display:none;width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-size:14px;font-weight:900}.meta{margin-top:12px;font-size:10px;line-height:1.5;color:#64748b;text-align:center}.icon{font-size:34px;display:block;margin-bottom:5px}
</style>
</head>
<body>
<div class="card">
<div class="head"><h1>Ubicación de unidad</h1><p>Tráfico App · Registro mediante QR</p></div>
<div class="body">
<div class="unit"><strong id="unitName">Validando QR…</strong><span id="unitDetail"></span></div>
<div id="status" class="status">Preparando actualización…</div>
<button id="retry" class="retry" type="button">Intentar nuevamente</button>
<div class="meta">Al permitir ubicación en tu teléfono, la posición se guarda automáticamente. Se conservan las últimas 5 ubicaciones de la unidad.</div>
</div>
</div>
<script>
(()=>{
const EDGE='https://nbogdhriavzqetnlrrau.supabase.co/functions/v1/cc-location';
const token=(new URLSearchParams(location.search).get('token')||'').trim();
const status=document.getElementById('status'), retry=document.getElementById('retry');
let busy=false;
const setStatus=(html,type='')=>{status.innerHTML=html;status.className='status'+(type?' '+type:'');};
const showRetry=()=>retry.style.display='block';
async function validate(){
 if(!token){setStatus('QR inválido: falta el token de la unidad.','err');return false;}
 try{
  const r=await fetch(EDGE+'?q='+encodeURIComponent(token),{cache:'no-store'}); const d=await r.json();
  if(!r.ok||!d.ok) throw new Error(d.error||'No se pudo validar la unidad');
  document.getElementById('unitName').textContent=d.unidad||'Unidad';
  document.getElementById('unitDetail').textContent=[d.descripcion,d.tipoUnidad||d.categoria,d.estatus?('Estatus: '+d.estatus):''].filter(Boolean).join(' · ');
  return true;
 }catch(e){setStatus('No se pudo validar este QR.<br>'+String(e.message||e),'err');showRetry();return false;}
}
function locate(){
 if(busy)return; if(!navigator.geolocation){setStatus('Este navegador no permite obtener ubicación.','err');showRetry();return;}
 busy=true;retry.style.display='none';setStatus('Solicitando permiso de ubicación…');
 navigator.geolocation.getCurrentPosition(async p=>{
  try{
   setStatus('Ubicación detectada. Guardando…');
   const r=await fetch(EDGE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q:token,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy})});
   const d=await r.json(); if(!r.ok||!d.ok) throw new Error(d.error||'No se pudo guardar');
   setStatus('<span class="icon">✓</span>UBICACIÓN ACTUALIZADA<br><small>Precisión aproximada: '+Math.round(Number(p.coords.accuracy)||0)+' m</small>','ok');
  }catch(e){setStatus('No se pudo actualizar la ubicación.<br>'+String(e.message||e),'err');showRetry();}
  finally{busy=false;}
 },err=>{const m=err.code===1?'Debes permitir el acceso a ubicación para registrar esta unidad.':err.code===2?'No fue posible determinar la ubicación del teléfono.':'Se agotó el tiempo para obtener la ubicación.';setStatus(m,'err');busy=false;showRetry();},{enableHighAccuracy:true,timeout:25000,maximumAge:0});
}
async function start(){if(await validate()){setStatus('Unidad validada. Solicitando ubicación…');locate();}}
retry.onclick=async()=>{if(await validate())locate();};start();
})();
</script>
</body>
</html>
