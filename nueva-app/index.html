<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tráfico App"><link rel="manifest" href="manifest.webmanifest"><title>Tráfico App Móvil</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#0f172a}*{box-sizing:border-box}body{margin:0;background:#f1f5f9;min-height:100dvh}.hidden{display:none!important}.app{padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));min-height:100dvh}.shell{max-width:520px;margin:auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;overflow:hidden;box-shadow:0 18px 55px #0f172a18}.head{padding:24px 20px;background:linear-gradient(145deg,#0f172a,#1e3a8a);color:#fff}.head h1,.head h2{margin:0}.head p{margin:6px 0 0;color:#bfdbfe;font-size:12px}.body{padding:20px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:900;color:#475569;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:14px 15px;font-size:16px;background:#fff}.btn{width:100%;border:0;border-radius:14px;padding:14px 15px;background:#2563eb;color:#fff;font-weight:900;font-size:15px}.btn.secondary{background:#e2e8f0;color:#334155}.btn.green{background:#15803d}.btn:disabled{opacity:.55}.msg{min-height:20px;margin-top:10px;font-size:12px;font-weight:800}.error{color:#b91c1c}.ok{color:#166534}.muted{color:#64748b}.operator{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:11px 12px;margin-bottom:15px;color:#1e3a8a;font-size:12px}.folio{border:1px solid #dbeafe;border-radius:17px;padding:15px;margin-bottom:11px;background:#fff}.folio strong{font-size:17px}.folio small{display:block;color:#64748b;margin-top:4px}.pill{display:inline-block;margin-top:8px;border-radius:999px;padding:5px 8px;background:#fff7ed;color:#9a3412;font-size:10px;font-weight:900}.pill.ok{background:#dcfce7;color:#166534}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.photo{border:2px dashed #93c5fd;border-radius:15px;padding:12px;background:#eff6ff}.photo img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:8px;display:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.empty{text-align:center;padding:28px 8px;color:#64748b}.count{font-size:11px;font-weight:900;background:#dbeafe;color:#1e40af;padding:6px 9px;border-radius:999px}
</style></head><body><main class="app"><div class="shell">
<section id="login" class="card"><div class="head"><h1>Bienvenido</h1><p>Ingresa con tu usuario y contraseña.</p></div><div class="body"><form id="loginForm"><div class="field"><label>Usuario</label><input id="username" autocomplete="username" autocapitalize="none" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn">Iniciar sesión</button></form><div id="loginMsg" class="msg muted"></div></div></section>
<section id="list" class="card hidden"><div class="head"><div class="top"><div><h2>Hojas de servicio</h2><p id="operatorName"></p></div><span id="folioCount" class="count">0</span></div></div><div class="body"><div id="folios"></div><button id="refresh" class="btn secondary" type="button">Actualizar</button><button id="logout" class="btn secondary" type="button" style="margin-top:9px">Cerrar sesión</button></div></section>
<section id="capture" class="card hidden"><div class="head"><h2 id="captureFolio">Hoja de servicio</h2><p>La evidencia se guardará sin comprobar la hoja.</p></div><div class="body"><div id="captureOperator" class="operator"></div><form id="captureForm"><div class="field"><label>Cliente *</label><select id="client" required></select></div><div class="field"><label>Tipo de viaje *</label><select id="trip" required><option value="">Selecciona...</option><option>IMPORTACIÓN</option><option>EXPORTACIÓN</option><option>CRUCE</option><option>FORÁNEO</option><option>MOVIMIENTO</option><option>OTRO</option></select></div><div class="field"><label>Clasificación *</label><select id="classification" required><option value="">Selecciona...</option><option>CARGADO</option><option>VACÍO</option><option>LOCAL</option><option>FORÁNEO</option><option>OTRO</option></select></div><div class="field"><label>Foto de la hoja *</label><div class="photo"><input id="photo" type="file" accept="image/*" capture="environment" required><img id="preview" alt="Vista previa"></div></div><button id="save" class="btn green" type="submit">Guardar evidencia</button></form><div id="captureMsg" class="msg muted"></div><div class="actions"><button id="back" class="btn secondary" type="button">Regresar</button><button id="logout2" class="btn secondary" type="button">Cerrar sesión</button></div></div></section>
</div></main><script src="../profesional/assets/js/vendor/supabase-sdk.js"></script><script>
const sb=window.supabase.createClient('https://nbogdhriavzqetnlrrau.supabase.co','sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let DATA=null,CURRENT=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(id){['login','list','capture'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function msg(id,t,c='muted'){$(id).className='msg '+c;$(id).textContent=t||''}function email(u){return u.trim().toLowerCase()+'@usuarios.trafico-app.com'}
async function load(){const {data,error}=await sb.rpc('app_mobile_hojas_data');if(error||!data?.ok)throw new Error(error?.message||data?.error||'No se pudieron cargar tus hojas.');DATA=data;renderList();return data}
function renderList(){const u=DATA.usuario||{},rows=DATA.folios||[];$('operatorName').textContent=(u.operadorNombre||'Operador')+' · '+rows.length+' pendiente(s)';$('folioCount').textContent=rows.length+' hoja'+(rows.length===1?'':'s');$('folios').innerHTML=rows.length?rows.map(x=>'<button type="button" class="folio" data-id="'+esc(x.id)+'" style="width:100%;text-align:left"><div class="top"><strong>'+esc(x.folio)+'</strong><span class="pill '+(x.evidencia?'ok':'')+'">'+(x.evidencia?'EVIDENCIA CARGADA':'PENDIENTE')+'</span></div><small>Responsable: '+esc(x.responsable||'—')+'</small>'+(x.evidencia?'<small>'+esc(x.evidencia.cliente||'')+' · '+esc(x.evidencia.tipoViaje||'')+' · '+esc(x.evidencia.clasificacion||'')+'</small>':'')+'</button>').join(''):'<div class="empty">No tienes hojas de servicio asignadas pendientes.</div>';document.querySelectorAll('.folio[data-id]').forEach(b=>b.onclick=()=>openFolio(b.dataset.id));show('list')}
function openFolio(id){CURRENT=(DATA.folios||[]).find(x=>x.id===id);if(!CURRENT)return;$('captureFolio').textContent=CURRENT.folio;$('captureOperator').innerHTML='<b>Operador:</b> '+esc(DATA.usuario.operadorNombre)+'<br><b>Estatus:</b> Pendiente de comprobar';$('client').innerHTML='<option value="">Selecciona cliente</option>'+(DATA.clientes||[]).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.nombre)+'</option>').join('');$('captureForm').reset();$('preview').style.display='none';$('preview').src='';if(CURRENT.evidencia){$('client').value=CURRENT.evidencia.clienteId||'';$('trip').value=CURRENT.evidencia.tipoViaje||'';$('classification').value=CURRENT.evidencia.clasificacion||'';msg('captureMsg','Ya existe evidencia; puedes reemplazarla.','muted')}else msg('captureMsg','');show('capture')}
async function logout(){await sb.auth.signOut();DATA=null;CURRENT=null;$('password').value='';show('login');msg('loginMsg','Sesión cerrada.')}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;msg('loginMsg','Validando acceso...');try{const u=$('username').value.trim(),p=$('password').value;if(!/^[a-zA-Z0-9._-]{3,}$/.test(u))throw new Error('Usuario no válido.');const {error}=await sb.auth.signInWithPassword({email:email(u),password:p});if(error)throw new Error('Usuario o contraseña incorrectos.');await load()}catch(err){await sb.auth.signOut().catch(()=>{});msg('loginMsg',err.message||String(err),'error')}finally{$('loginBtn').disabled=false}};
$('refresh').onclick=()=>load().catch(e=>alert(e.message||e));$('logout').onclick=logout;$('logout2').onclick=logout;$('back').onclick=()=>renderList();$('photo').onchange=()=>{const f=$('photo').files[0],p=$('preview');if(!f){p.style.display='none';return}p.src=URL.createObjectURL(f);p.style.display='block'};
$('captureForm').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;msg('captureMsg','Guardando fotografía y datos...');let path='';try{if(!CURRENT)throw new Error('Selecciona una hoja.');const file=$('photo').files[0];if(!file)throw new Error('La foto es obligatoria.');const {data:u}=await sb.auth.getUser();const uid=u?.user?.id;if(!uid)throw new Error('Sesión no válida.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';path=uid+'/'+CURRENT.id+'/'+Date.now()+'.'+ext;const {error:up}=await sb.storage.from('app-hojas-servicio').upload(path,file,{contentType:file.type||'image/jpeg'});if(up)throw up;const {data,error}=await sb.rpc('app_mobile_save_hoja',{p_folio_id:CURRENT.id,p_cliente_id:$('client').value,p_tipo_viaje:$('trip').value,p_clasificacion:$('classification').value,p_foto_path:path});if(error||!data?.ok)throw new Error(error?.message||data?.error||'No se pudo guardar');msg('captureMsg','Evidencia guardada. La hoja continúa pendiente de comprobar.','ok');await load()}catch(err){if(path)await sb.storage.from('app-hojas-servicio').remove([path]).catch(()=>{});msg('captureMsg',err.message||String(err),'error')}finally{b.disabled=false}};
(async()=>{try{const {data}=await sb.auth.getSession();if(data?.session)await load();else show('login')}catch(e){await sb.auth.signOut().catch(()=>{});show('login');msg('loginMsg',e.message||String(e),'error')}})();
</script></body></html>
