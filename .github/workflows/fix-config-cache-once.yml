name: Fix config cache once
on:
  push:
    paths:
      - '.github/workflows/fix-config-cache-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force fresh configuracion.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text()
          old='assets/js/modules/configuracion.js'
          new='assets/js/modules/configuracion.js?v=config-qr-preview-20260913-0104'
          if new not in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Configuración: forzar carga fresca del modal QR'
          git push origin HEAD:main
