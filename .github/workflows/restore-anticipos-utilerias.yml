name: Restaurar Utilerias Anticipos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/add_anticipos_utilerias_ui.py'
      - '.github/workflows/restore-anticipos-utilerias.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restaurar utilerias
        run: python3 .github/scripts/add_anticipos_utilerias_ui.py
      - name: Validar
        run: |
          grep -q 'Utilerías de carga histórica de anticipos' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'data-antv="utilerias"' profesional/assets/js/modules/anticipos-profesional-flow.js
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/assets/js/modules/anticipos-profesional-flow.js
          if git diff --cached --quiet; then
            echo "Utilerias ya presentes"
          else
            git commit -m "Restaurar utilerias de Anticipos"
            git push origin main
          fi
