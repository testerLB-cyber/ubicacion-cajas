<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aceptar hojas de servicio</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}.wrap{max-width:680px;margin:30px auto;padding:16px}.card{background:#fff;border-radius:18px;box-shadow:0 18px 45px #0f172a20;overflow:hidden}.head{background:#0f172a;color:#fff;padding:22px}.body{padding:22px}.box{background:#eff6ff;border:1px solid #bfdbfe;padding:14px;border-radius:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:bold;display:block;margin:10px 0 5px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px}canvas{width:100%;height:180px;border:1px dashed #94a3b8;border-radius:10px;touch-action:none;background:#fff}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:#fff}.light{background:#e2e8f0}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div class="head"><h2 style="margin:0">Aceptación de Hojas de Servicio</h2><div style="font-size:12px;color:#bfdbfe;margin-top:5px">Confirma la recepción del rango asignado.</div></div><div class="body" id="app">Cargando asignación...</div></div></div><script src="assets/js/vendor/supabase-sdk.js"></script><script src="assets/js/config/supabase-config.js"></script><script>(async()=>{const app=document.getElementById('app'),t=new URLSearchParams(location.search).get('t')||'';if(!window.supabase||!t){app.innerHTML='<b>Enlace inválido.</b>';return}const sb=window.supabase.createClient(window.GM_SUPABASE_URL,window.GM_SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});const r=await sb.rpc('hs_public_assignment',{p_token:t});if(r.error||!r.data?.ok){app.innerHTML='<b>No fue posible abrir esta asignación.</b><div style="margin-top:8px">'+(r.error?.message||r.data?.error||'Enlace inválido o vencido')+'</div>';return}const a=r.data.asignacion;app.innerHTML='<div class="box"><strong>'+a.folioDesde+' → '+a.folioHasta+'</strong><div style="margin-top:6px">Cantidad: '+a.cantidad+' hojas</div><div>Responsable: '+(a.responsableNombre||'')+'</div></div><label>Nombre de quien recibe *</label><input id="name" value="'+(a.responsableNombre||'').replace(/"/g,'&quot;')+'"><label>Firma electrónica *</label><canvas id="sig" width="900" height="250"></canvas><div class="actions"><button class="btn light" id="clear">Limpiar firma</button><button class="btn primary" id="accept">Aceptar y firmar</button></div><div id="msg" style="margin-top:12px"></div>';const c=document.getElementById('sig'),ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';let down=false,has=false;const pos=e=>{const q=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-q.left)*c.width/q.width,y:(p.clientY-q.top)*c.height/q.height}};const start=e=>{e.preventDefault();down=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};const move=e=>{if(!down)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();has=true};const end=e=>{e.preventDefault();down=false};['pointerdown','touchstart'].forEach(x=>c.addEventListener(x,start,{passive:false}));['pointermove','touchmove'].forEach(x=>c.addEventListener(x,move,{passive:false}));['pointerup','pointerleave','touchend'].forEach(x=>c.addEventListener(x,end,{passive:false}));document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);has=false};document.getElementById('accept').onclick=async()=>{const n=document.getElementById('name').value.trim(),m=document.getElementById('msg'),b=document.getElementById('accept');if(!n)return m.textContent='Captura tu nombre.';if(!has)return m.textContent='Firma dentro del recuadro.';b.disabled=true;m.textContent='Guardando aceptación...';const z=await sb.rpc('hs_accept_assignment',{p_token:t,p_nombre:n,p_firma_data:c.toDataURL('image/png'),p_user_agent:navigator.userAgent});if(z.error||!z.data?.ok){m.textContent=z.error?.message||z.data?.error||'No se pudo guardar';b.disabled=false;return}m.innerHTML='<b style="color:#166534">Aceptación registrada correctamente.</b><br>Los folios quedaron bajo tu custodia.';document.getElementById('clear').disabled=true}})();</script></body></html>
