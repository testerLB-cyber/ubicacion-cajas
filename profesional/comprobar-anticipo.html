<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tráfico App · Subir comprobantes</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0}.wrap{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px rgba(15,23,42,.08)}header{background:#0f172a;color:#fff;padding:18px}header h2{margin:0;font-size:20px}header div{font-size:11px;color:#cbd5e1;margin-top:4px}main{padding:18px}.upload{border:2px dashed #93c5fd;background:#eff6ff;border-radius:16px;padding:22px;text-align:center}.upload strong{display:block;font-size:16px;margin-bottom:6px}.upload p{font-size:12px;color:#64748b;margin:0 0 14px}.file-btn{display:inline-flex;align-items:center;justify-content:center;background:#2563eb;color:#fff;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.file-btn input{display:none}.preview{margin-top:14px}.preview img{max-width:100%;max-height:360px;border-radius:12px;border:1px solid #e2e8f0}.file-box{padding:12px;border-radius:10px;background:#fff;border:1px solid #cbd5e1;font-size:12px;color:#475569}.msg{padding:12px;border-radius:10px;margin-top:12px;font-size:12px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}.history{margin-top:16px}.item{padding:10px 0;border-bottom:1px solid #e2e8f0}.item b{display:block}.muted{font-size:10px;color:#64748b;margin-top:3px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header><h2>Subir comprobante</h2><div id="folio">Validando enlace...</div></header>
<main id="main">
  <div class="upload">
    <strong>Tomar foto o subir comprobante</strong>
    <p>Selecciona una foto o PDF. Se enviará inmediatamente como borrador a la app para llenar los datos manualmente.</p>
    <label class="file-btn">Tomar / subir archivo<input id="file" type="file" accept="image/*,application/pdf" capture="environment"></label>
    <div id="preview" class="preview"></div>
  </div>
  <div id="msg"></div>
  <div class="history"><strong>Enviados a la app</strong><div id="history"></div></div>
</main>
</div></div>
<script>
const ENDPOINT="https://nbogdhriavzqetnlrrau.supabase.co/functions/v1/cc-anticipo-public";
const KEY="sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy";
const token=new URLSearchParams(location.search).get('t')||'';
let A=null,sent=[];
async function api(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Error');return j}
function fileData(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(file)})}
function renderHistory(){document.getElementById('history').innerHTML=sent.length?sent.map((x,i)=>'<div class="item"><b>Comprobante '+(i+1)+' enviado</b><div class="muted">'+x.name+'</div></div>').join(''):'<div class="muted" style="padding-top:8px">Todavía no has enviado archivos.</div>'}
async function load(){try{const j=await api({action:'get',token});if(j.tipo!=='COMPROBACION')throw new Error('Este enlace no corresponde a comprobación.');A=j.anticipo;document.getElementById('folio').textContent=(A.folio||'')+' · '+(A.operador||'');renderHistory()}catch(e){document.getElementById('main').innerHTML='<div class="msg err">'+e.message+'</div>'}}
async function uploadFile(file){
 const msg=document.getElementById('msg'),pv=document.getElementById('preview');
 try{
  msg.className='msg info';msg.textContent='Subiendo comprobante...';
  const data=await fileData(file);
  if(file.type&&file.type.indexOf('image/')===0)pv.innerHTML='<img src="'+data+'" alt="Comprobante">';
  else pv.innerHTML='<div class="file-box">'+(file.name||'Documento PDF')+'</div>';
  await api({action:'stage_photo',token,fileData:data,fileName:file.name||'comprobante',mime:file.type||'application/octet-stream',ocrTotal:null,ocrDescripcion:'',ocrTexto:''});
  sent.push({name:file.name||'Comprobante'});renderHistory();
  msg.className='msg ok';msg.textContent='Comprobante enviado a la app. Puedes subir otro.';
  document.getElementById('file').value='';setTimeout(()=>{pv.innerHTML=''},700);
 }catch(e){msg.className='msg err';msg.textContent=e.message||String(e)}
}
document.getElementById('file').addEventListener('change',function(){const file=this.files&&this.files[0];if(file)uploadFile(file)});
load();
</script>
</body></html>
