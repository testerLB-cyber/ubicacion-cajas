name: patch-app-correcta
on:
  push:
    paths:
      - '.github/workflows/zz-patch-app-correcta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify and commit
        run: |
          grep -Fq '#ccGlobalAlertsBtn{position:fixed;right:18px;bottom:22px;' app-correcta.html
          grep -Fq 'const ccCoordCounts=new Map();' app-correcta.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-correcta.html
          git commit -m 'Mueve alertas y separa unidades superpuestas en mapa'
          git push
