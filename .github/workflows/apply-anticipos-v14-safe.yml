name: Aplicar Anticipos v14 seguro

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-anticipos-v14-safe.yml'

permissions:
  contents: write

jobs:
  apply-safe-v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir inicializacion v13 y activar despues de Auth
        shell: python
        run: |
          from pathlib import Path

          js_path = Path('profesional/assets/js/modules/anticipos-v13-erp-catalogos.js')
          html_path = Path('profesional/index.html')
          js = js_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          old = "function install(){ensureNav();const root=document.getElementById('ccPanelAnticipos')||document.body;new MutationObserver(ensureNav).observe(root,{childList:true,subtree:true})}\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(install,300));else setTimeout(install,300);"
          new = "function install(){try{ensureNav()}catch(e){console.error('[Anticipos v14] No se pudo instalar menu ERP:',e)}}\n function bootSafe(){let tries=0;const run=()=>{tries++;install();if(document.querySelector('.cc-ant-nav')||tries>=20){clearInterval(timer)}};run();const timer=setInterval(run,500)}\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(bootSafe,500),{once:true});else setTimeout(bootSafe,500);"
          if old not in js:
              raise SystemExit('No se encontro bloque de inicializacion v13 esperado; no se modifica nada.')
          js = js.replace(old, new, 1)
          js = js.replace('Anticipos v13 · Catálogos ERP + Utilerías', 'Anticipos v14 · Catálogos ERP + Utilerías · Inicialización segura', 1)
          js_path.write_text(js, encoding='utf-8')

          tag13 = '<script src="assets/js/modules/anticipos-v13-erp-catalogos.js?v=v13"></script>\n'
          tag14 = '<script src="assets/js/modules/anticipos-v13-erp-catalogos.js?v=v14-safe"></script>\n'
          html = html.replace(tag13, '')
          anchor = '<script id="cc-auth-security-js" src="assets/js/security/auth-permissions.js"></script>\n'
          if anchor not in html:
              raise SystemExit('No se encontro ancla auth-permissions.js')
          if tag14 not in html:
              html = html.replace(anchor, anchor + tag14, 1)
          html_path.write_text(html, encoding='utf-8')

      - name: Validaciones estaticas
        run: |
          node --check profesional/assets/js/modules/anticipos-v13-erp-catalogos.js
          python - <<'PY'
          from pathlib import Path
          js=Path('profesional/assets/js/modules/anticipos-v13-erp-catalogos.js').read_text(encoding='utf-8')
          html=Path('profesional/index.html').read_text(encoding='utf-8')
          assert 'new MutationObserver(ensureNav)' not in js, 'Sigue presente observer recursivo'
          assert 'setInterval(run,500)' in js, 'No existe arranque limitado'
          auth=html.index('id="cc-auth-security-js"')
          v14=html.index('anticipos-v13-erp-catalogos.js?v=v14-safe')
          assert v14 > auth, 'v14 debe cargar despues de Auth'
          assert html.count('anticipos-v13-erp-catalogos.js') == 1, 'Modulo ERP duplicado'
          assert 'ccAntOpenERPCatalogs=showERP' in js
          assert 'ccAntOpenUtilities=showUtils' in js
          print('OK: sintaxis, orden Auth->ERP, sin observer recursivo y sin duplicados')
          PY

      - name: Commit cambios v14
        run: |
          if git diff --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/assets/js/modules/anticipos-v13-erp-catalogos.js profesional/index.html
          git commit -m 'Anticipos v14 seguro sin bloqueo de Auth Supabase'
          git push
