name: Aplicar Clientes Divisiones v2
on:
  push:
    paths:
      - 'profesional/assets/js/modules/clientes-divisiones-v2-unificado.js'
      - '.github/workflows/apply-clientes-divisiones-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JS
        run: node --check profesional/assets/js/modules/clientes-divisiones-v2-unificado.js
      - name: Insertar modulo v2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text()
          line='<script src="assets/js/modules/clientes-divisiones-v2-unificado.js?v=v2"></script>'
          if line not in s:
              anchor='<script src="assets/js/modules/clientes-divisiones-v1.js?v=v1"></script>'
              if anchor not in s:
                  raise SystemExit('No se encontro modulo clientes v1')
              s=s.replace(anchor,anchor+'\n'+line)
              p.write_text(s)
          assert s.count(line)==1
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profesional/index.html
          git commit -m "Unificar Clientes y bloquear clientes inactivos"
          git push
