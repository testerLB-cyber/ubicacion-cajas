<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#0f172a"><title>Unidad · Tráfico App</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef2f7;color:#0f172a;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}.card{width:min(560px,100%);margin:auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px #0f172a29}.head{padding:22px;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff}.head h1{margin:0;font-size:21px}.head p{margin:5px 0 0;color:#bfdbfe;font-size:12px}.body{padding:20px}.unit{border:1px solid #bfdbfe;background:#eff6ff;border-radius:14px;padding:14px;margin-bottom:14px}.unit strong{display:block;font-size:20px}.unit span{font-size:12px;color:#475569}.status{padding:15px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;text-align:center;font-size:14px;font-weight:800}.status.ok{background:#dcfce7;border-color:#86efac;color:#166534}.status.err{background:#fee2e2;border-color:#fecaca;color:#991b1b}.retry{display:none;width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:900}.docs{margin-top:16px;border-top:1px solid #e2e8f0;padding-top:14px}.docs h2{font-size:15px;margin:0 0 9px}.doc{display:flex;align-items:center;gap:8px;border:1px solid #e2e8f0;border-radius:10px;padding:9px;margin-top:6px}.doc span{flex:1;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis}.doc a{padding:7px 9px;border-radius:7px;text-decoration:none;font-size:11px;font-weight:900}.view{background:#dbeafe;color:#1d4ed8}.down{background:#2563eb;color:#fff}.empty{font-size:11px;color:#64748b;padding:8px 0}.meta{margin-top:12px;font-size:10px;color:#64748b;text-align:center}</style></head><body><div class="card"><div class="head"><h1>Unidad y documentos</h1><p>Tráfico App · Acceso mediante QR</p></div><div class="body"><div class="unit"><strong id="unitName">Validando QR…</strong><span id="unitDetail"></span></div><div id="status" class="status">Preparando actualización…</div><button id="retry" class="retry">Intentar nuevamente</button><section class="docs"><h2>📄 Documentos de la unidad</h2><div id="docs"><div class="empty">Cargando documentos autorizados…</div></div></section><div class="meta">Solo se muestran documentos autorizados como visibles para operador. Las ligas de acceso son temporales.</div></div></div><script>(()=>{const EDGE='https://nbogdhriavzqetnlrrau.supabase.co/functions/v1/cc-location',token=(new URLSearchParams(location.search).get('token')||'').trim(),status=document.getElementById('status'),retry=document.getElementById('retry'),docs=document.getElementById('docs');let busy=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),setStatus=(h,t='')=>{status.innerHTML=h;status.className='status'+(t?' '+t:'')};function renderDocs(a){docs.innerHTML=!a?.length?'<div class="empty">No hay documentos disponibles para operador.</div>':a.map(d=>'<div class="doc"><span>📎 '+esc(d.titulo||d.fileName||'Documento')+'</span><a class="view" href="'+esc(d.url)+'" target="_blank" rel="noopener">Ver</a><a class="down" href="'+esc(d.url)+'" download="'+esc(d.fileName||'documento')+'">Descargar</a></div>').join('')}async function validate(){if(!token){setStatus('QR inválido: falta token.','err');return false}try{const r=await fetch(EDGE+'?q='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo validar');document.getElementById('unitName').textContent=d.unidad||'Unidad';document.getElementById('unitDetail').textContent=[d.descripcion,d.tipoUnidad||d.categoria,d.estatus?'Estatus: '+d.estatus:''].filter(Boolean).join(' · ');renderDocs(d.documentos||[]);return true}catch(e){setStatus('No se pudo validar este QR.<br>'+esc(e.message||e),'err');retry.style.display='block';docs.innerHTML='<div class="empty">No fue posible cargar documentos.</div>';return false}}function locate(){if(busy)return;if(!navigator.geolocation){setStatus('Este navegador no permite obtener ubicación.','err');retry.style.display='block';return}busy=true;retry.style.display='none';setStatus('Solicitando permiso de ubicación…');navigator.geolocation.getCurrentPosition(async p=>{try{setStatus('Ubicación detectada. Guardando…');const r=await fetch(EDGE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q:token,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo guardar');setStatus('✓ UBICACIÓN ACTUALIZADA<br><small>Precisión aproximada: '+Math.round(Number(p.coords.accuracy)||0)+' m</small>','ok')}catch(e){setStatus('No se pudo actualizar la ubicación.<br>'+esc(e.message||e),'err');retry.style.display='block'}finally{busy=false}},e=>{setStatus(e.code===1?'Debes permitir el acceso a ubicación.':'No fue posible obtener la ubicación.','err');busy=false;retry.style.display='block'},{enableHighAccuracy:true,timeout:25000,maximumAge:0})}async function start(){if(await validate()){setStatus('Unidad validada. Solicitando ubicación…');locate()}}retry.onclick=async()=>{if(await validate())locate()};start()})();</script></body></html>
