name: Aplicar Anticipos v12 Catalogos y Flujos

on:
  workflow_dispatch:
  push:
    paths:
      - 'profesional/assets/js/modules/anticipos-v12-catalogos-flujos.js'
      - '.github/workflows/apply-anticipos-v12.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insertar modulo v12
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          t=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/modules/anticipos-v12-catalogos-flujos.js?v=v12"></script>'
          if tag not in t:
              anchor='<script src="assets/js/modules/anticipos-selector-standalone.js?v=selector-v9-fast"></script>'
              if anchor not in t:
                  raise SystemExit('No se encontro anchor selector')
              t=t.replace(anchor,anchor+'\n'+tag)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'Anticipos v12' profesional/assets/js/modules/anticipos-v12-catalogos-flujos.js
          grep -q 'anticipos-v12-catalogos-flujos.js?v=v12' profesional/index.html
          grep -q 'Configuración por destino' profesional/assets/js/modules/anticipos-v12-catalogos-flujos.js
          grep -q 'No hay conceptos por default para Beneficiarios' profesional/assets/js/modules/anticipos-v12-catalogos-flujos.js
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/index.html
          if git diff --cached --quiet; then
            echo "v12 ya insertado"
          else
            git commit -m "Activar Anticipos v12 catalogos y flujos"
            git push origin main
          fi
