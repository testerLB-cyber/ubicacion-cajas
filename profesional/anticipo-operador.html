<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tráfico App · Anticipo</title>
<style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px rgba(15,23,42,.08)}header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:20px}header h1{margin:0;font-size:21px}main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.field small{display:block;color:#64748b;font-size:10px;font-weight:700}.field strong{display:block;margin-top:4px}.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.total{padding:14px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe}.total b{font-size:23px;display:block;margin-top:4px}.concept{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e2e8f0}.sig{border:2px dashed #94a3b8;border-radius:12px;overflow:hidden;background:#fff;margin-top:8px}canvas{width:100%;height:220px;display:block;touch-action:none}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.light{background:#e2e8f0;color:#334155}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.msg{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}@media(max-width:600px){.grid,.totals{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="card"><header><h1>Tráfico App · Enterado de Anticipo</h1><div id="folio"></div></header><main id="main"><div>Cargando anticipo...</div></main></div></div>
<script>
const ENDPOINT="https://nbogdhriavzqetnlrrau.supabase.co/functions/v1/cc-anticipo-public",KEY="sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy",token=new URLSearchParams(location.search).get('t')||'';
const money=v=>Number(v||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
async function api(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Error');return j}
async function load(){try{const j=await api({action:'get',token});if(j.tipo!=='FIRMA')throw new Error('Este enlace no corresponde a firma.');const a=j.anticipo;document.getElementById('folio').textContent=a.folio||'';document.getElementById('main').innerHTML='<div class="grid"><div class="field"><small>OPERADOR</small><strong>'+a.operador+'</strong></div><div class="field"><small>UNIDAD</small><strong>'+a.unidad+' · '+(a.unidadDescripcion||'')+'</strong></div><div class="field"><small>DESTINO</small><strong>'+a.destino+'</strong></div><div class="field"><small>TIPO</small><strong>'+a.tipoUnidad+'</strong></div><div class="field"><small>MÉTODO DE DEPÓSITO</small><strong>'+a.metodoDeposito+'</strong></div><div class="field"><small>VIAJE</small><strong>'+(a.viaje||'—')+'</strong></div></div><div class="totals"><div class="total">Total autorizado<b>'+money(a.montoAutorizado)+'</b></div><div class="total">Total entregado<b>'+money(a.montoEntregado)+'</b></div></div><h3>Conceptos autorizados</h3><div>'+a.detalles.map(x=>'<div class="concept"><span>'+x.concepto+(x.origen==='EXTRA'?' <b>+ Extra</b>':'')+'</span><b>'+money(x.monto)+'</b></div>').join('')+'</div><h3>Firma de enterado</h3><label>Nombre del firmante</label><input id="nombre" value="'+(a.operador||'')+'"><div class="sig"><canvas id="cv"></canvas></div><div class="btns"><button class="light" onclick="clearSig()">Limpiar firma</button><button class="primary" onclick="sign()">Firmar y guardar</button></div><div id="msg"></div>';setupCanvas()}catch(e){document.getElementById('main').innerHTML='<div class="msg err">'+e.message+'</div>'}}
let ctx,cv,drawing=false,hasInk=false;
function setupCanvas(){cv=document.getElementById('cv');const ratio=devicePixelRatio||1;cv.width=cv.clientWidth*ratio;cv.height=220*ratio;ctx=cv.getContext('2d');ctx.scale(ratio,ratio);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#0f172a';const pos=e=>{const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}};const down=e=>{e.preventDefault();drawing=true;hasInk=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};const up=()=>drawing=false;['mousedown','touchstart'].forEach(x=>cv.addEventListener(x,down,{passive:false}));['mousemove','touchmove'].forEach(x=>cv.addEventListener(x,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(x=>cv.addEventListener(x,up))}
function clearSig(){ctx.clearRect(0,0,cv.clientWidth,220);hasInk=false}
async function sign(){const msg=document.getElementById('msg');if(!hasInk){msg.className='msg err';msg.textContent='Firma dentro del recuadro.';return}try{await api({action:'sign',token,nombre:document.getElementById('nombre').value,signatureData:cv.toDataURL('image/png')});const main=document.getElementById('main');const folio=document.getElementById('folio');if(folio)folio.textContent='';if(main)main.innerHTML='<div style="text-align:center;padding:28px 14px"><div style="width:72px;height:72px;border-radius:50%;background:#dcfce7;color:#166534;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;font-weight:900">✓</div><h2 style="margin:0 0 8px;color:#166534">Firma registrada</h2><p style="margin:0;color:#475569;font-size:14px">La firma fue guardada correctamente. Ya puedes cerrar esta ventana.</p></div>';ctx=null;cv=null;drawing=false;hasInk=false}catch(e){if(msg){msg.className='msg err';msg.textContent=e.message}else{document.getElementById('main').innerHTML='<div class="msg err">'+e.message+'</div>'}}}
load();
</script></body></html>
