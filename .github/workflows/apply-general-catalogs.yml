name: Aplicar catalogos generales

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_general_people_catalogs_ui.py'
      - '.github/workflows/apply-general-catalogs.yml'
  workflow_run:
    workflows: ['Construir version profesional paralela']
    types: [completed]

permissions:
  contents: write

jobs:
  aplicar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Centralizar catalogos generales
        run: python3 .github/scripts/add_general_people_catalogs_ui.py
      - name: Validar centralizacion
        run: |
          grep -q 'Catálogos generales de personas v3 · menú Configuración' profesional/assets/js/modules/configuracion.js
          grep -q 'data.gpcNav' profesional/assets/js/modules/configuracion.js || grep -q 'gpcNav' profesional/assets/js/modules/configuracion.js
          ! grep -q 'Catálogos generales de personas v1' profesional/assets/js/modules/configuracion.js
      - name: Publicar cambio profesional
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/assets/js/modules/configuracion.js
          if git diff --cached --quiet; then
            echo "Catálogos generales ya aplicados"
            exit 0
          fi
          git commit -m "Centralizar catalogos generales en Configuracion"
          git push
