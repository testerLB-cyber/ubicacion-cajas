<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Foto de Hoja de Servicio</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a}.wrap{max-width:620px;margin:0 auto;padding:18px}.card{background:#fff;border-radius:20px;box-shadow:0 18px 50px #0f172a18;overflow:hidden}.head{background:#0f172a;color:#fff;padding:22px}.head h2{margin:0;font-size:21px}.head p{margin:6px 0 0;color:#cbd5e1;font-size:13px}.body{padding:20px}.folio{background:#eff6ff;border:1px solid #bfdbfe;border-radius:13px;padding:13px;margin-bottom:16px}.preview{display:none;background:#0f172a;border-radius:14px;padding:8px;margin:14px 0}.preview img{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:9px}.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.success{background:#16a34a;color:#fff}.light{background:#e2e8f0;color:#0f172a;margin-top:9px}.btn:disabled{opacity:.55}.msg{margin-top:14px;padding:11px 12px;border-radius:11px;background:#f8fafc;font-size:13px;color:#475569}.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.err{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}input[type=file]{position:absolute;left:-9999px}@media(max-width:500px){.wrap{padding:0}.card{border-radius:0;min-height:100vh}}</style></head><body><div class="wrap"><div class="card"><div class="head"><h2>Foto de Hoja de Servicio</h2><p>Toma la evidencia y se cargará directamente en la hoja seleccionada.</p></div><div class="body" id="app">Validando enlace...</div></div></div><script src="assets/js/vendor/supabase-sdk.js"></script><script src="assets/js/config/supabase-config.js"></script><script>(async()=>{const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('t')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!window.supabase||!token){app.innerHTML='<div class="msg err">Enlace inválido.</div>';return}const sb=window.supabase.createClient(window.GM_SUPABASE_URL,window.GM_SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});const r=await sb.rpc('hs_qr_photo_session',{p_token:token});if(r.error||!r.data?.ok){app.innerHTML='<div class="msg err">'+esc(r.error?.message||r.data?.error||'No fue posible abrir el enlace.')+'</div>';return}if(r.data.status!=='PENDIENTE'){app.innerHTML='<div class="folio"><strong>'+esc(r.data.folio||'Hoja de servicio')+'</strong></div><div class="msg '+(r.data.status==='CAPTURADA'?'ok':'err')+'">'+(r.data.status==='CAPTURADA'?'La foto ya fue recibida correctamente.':'Este enlace ya no está disponible.')+'</div>';return}app.innerHTML='<div class="folio"><small>FOLIO</small><div style="font-size:21px;font-weight:900;margin-top:3px">'+esc(r.data.folio||'—')+'</div></div><input id="cam" type="file" accept="image/*" capture="environment"><button class="btn primary" id="take">📷 Tomar foto</button><div class="preview" id="preview"><img id="img" alt="Vista previa"></div><button class="btn success" id="send" style="display:none">Usar esta foto</button><button class="btn light" id="again" style="display:none">Tomar otra</button><div class="msg" id="msg">El enlace es temporal y solo permite cargar una foto para este folio.</div>';const input=document.getElementById('cam'),take=document.getElementById('take'),send=document.getElementById('send'),again=document.getElementById('again'),preview=document.getElementById('preview'),img=document.getElementById('img'),msg=document.getElementById('msg');let chosen=null,previewUrl='';take.onclick=()=>input.click();again.onclick=()=>input.click();input.onchange=()=>{const f=input.files?.[0];if(!f)return;chosen=f;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(f);img.src=previewUrl;preview.style.display='block';send.style.display='block';again.style.display='block';take.style.display='none';msg.className='msg';msg.textContent='Revisa la foto y presiona “Usar esta foto”.';};async function compress(file){if(!file?.type?.startsWith('image/'))throw new Error('Selecciona una imagen válida.');const u=URL.createObjectURL(file);try{const im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=()=>rej(new Error('No se pudo leer la imagen.'));im.src=u});let w=im.naturalWidth,h=im.naturalHeight;const max=1800;if(Math.max(w,h)>max){const ratio=max/Math.max(w,h);w=Math.round(w*ratio);h=Math.round(h*ratio)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(im,0,0,w,h);const b=await new Promise(res=>c.toBlob(res,'image/jpeg',.78));if(!b)throw new Error('No se pudo preparar la imagen.');return b}finally{URL.revokeObjectURL(u)}}send.onclick=async()=>{if(!chosen)return;send.disabled=true;again.disabled=true;msg.className='msg';msg.textContent='Subiendo foto...';try{const blob=await compress(chosen),path='qr/'+token+'/'+Date.now()+'.jpg';const up=await sb.storage.from('app-hojas-servicio').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;const z=await sb.rpc('hs_qr_photo_complete',{p_token:token,p_foto_path:path});if(z.error||!z.data?.ok)throw new Error(z.error?.message||z.data?.error||'No se pudo ligar la foto.');msg.className='msg ok';msg.innerHTML='<strong>Foto cargada correctamente.</strong><br>Ya puedes cerrar esta página; la hoja se actualizará automáticamente.';send.style.display='none';again.style.display='none'}catch(e){msg.className='msg err';msg.textContent=e?.message||String(e);send.disabled=false;again.disabled=false}}})();</script></body></html>
