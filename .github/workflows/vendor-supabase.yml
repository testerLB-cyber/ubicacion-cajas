name: Vendor Supabase JS

on:
  push:
    paths:
      - ".github/workflows/vendor-supabase.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Supabase UMD
        run: |
          mkdir -p vendor
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://unpkg.com/@supabase/supabase-js@2.44.4/dist/umd/supabase.js" \
            -o vendor/supabase.js
          test -s vendor/supabase.js
      - name: Commit vendored library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase.js
          git diff --cached --quiet && exit 0
          git commit -m "Vendor Supabase JS for reliable browser loading"
          git push
