name: Bump config print QR v2 once
on:
  push:
    paths:
      - '.github/workflows/bump-config-print-qr-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump helper version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text()
          import re
          s=re.sub(r'configuracion-impresion-qr-persist-v1\.js\?v=[^"\']+', 'configuracion-impresion-qr-persist-v1.js?v=isolated-v2-20260913-0122', s, count=1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/index.html
          git commit -m 'Configuración: activar modal aislado de Impresión QR v2'
          git push origin HEAD:main
