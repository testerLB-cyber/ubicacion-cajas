name: Aplicar selector inmediato Anticipos v9

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/add_anticipos_selector_standalone_v7.py'
      - '.github/workflows/apply-anticipos-selector-v7.yml'
  workflow_run:
    workflows:
      - 'Construir version profesional paralela'
    types:
      - completed

permissions:
  contents: write

jobs:
  selector-v9:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar selector inmediato v9
        run: python3 .github/scripts/add_anticipos_selector_standalone_v7.py
      - name: Validar selector inmediato
        run: |
          test -f profesional/assets/js/modules/anticipos-selector-standalone.js
          grep -q 'Selector inmediato Operador/Beneficiario v9' profesional/assets/js/modules/anticipos-selector-standalone.js
          grep -q 'ccAntSelectorStandaloneV9' profesional/index.html
          grep -q 'anticipos-selector-standalone.js?v=selector-v9-fast' profesional/index.html
          grep -q "addEventListener('click',capture,true)" profesional/assets/js/modules/anticipos-selector-standalone.js
      - name: Publicar selector v9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional
          if git diff --cached --quiet; then
            echo "Selector v9 ya aplicado"
            exit 0
          fi
          git commit -m "Aplicar apertura inmediata de anticipos v9"
          git push
