name: Remove old config print persist once
on:
  push:
    paths:
      - '.github/workflows/remove-old-config-print-persist-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove old persistent print loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('profesional/index.html')
          s=p.read_text()
          s=re.sub(r'\s*<script src="assets/js/modules/configuracion-impresion-qr-persist-v1\.js\?v=[^"]+"></script>','',s)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Configuración: retirar loader viejo de Impresión QR'
          git push origin HEAD:main