<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tráfico App">
<link rel="manifest" href="manifest.webmanifest">
<title>Tráfico App Móvil</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f1f5f9}.hidden{display:none!important}.app{min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}.shell{max-width:520px;margin:auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 18px 55px rgba(15,23,42,.10);overflow:hidden}.head{padding:28px 22px;background:linear-gradient(145deg,#0f172a,#1e3a8a);color:#fff}.head h1{margin:0;font-size:28px}.head p{margin:7px 0 0;color:#bfdbfe;font-size:13px}.body{padding:22px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:14px 15px;font-size:16px;background:white;outline:none}.field input:focus,.field select:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1)}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:900;background:#2563eb;color:#fff}.btn.secondary{background:#e2e8f0;color:#334155}.btn.green{background:#15803d}.btn:disabled{opacity:.55}.msg{margin-top:11px;min-height:20px;font-size:12px;font-weight:800}.error{color:#b91c1c}.ok{color:#166534}.muted{color:#64748b}.welcome{text-align:center;padding:28px 22px}.avatar{width:82px;height:82px;border-radius:25px;margin:0 auto 16px;background:linear-gradient(145deg,#2563eb,#1e40af);color:white;display:grid;place-items:center;font-size:32px;font-weight:900}.welcome h2{margin:0;font-size:25px}.welcome p{color:#64748b;margin:8px 0 18px}.operator{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:12px;margin:14px 0 20px;font-size:12px;color:#1e3a8a}.menu-btn{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:16px;width:100%;box-shadow:0 8px 24px rgba(37,99,235,.08);font-weight:900;color:#1e3a8a;font-size:15px}.menu-icon{width:42px;height:42px;border-radius:13px;background:#dbeafe;display:grid;place-items:center;font-size:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.topbar h2{font-size:19px;margin:0}.mini{font-size:11px;color:#64748b}.photo-box{border:2px dashed #93c5fd;border-radius:16px;padding:14px;text-align:center;background:#eff6ff}.photo-box input{width:100%;font-size:14px}.preview{margin-top:10px;max-height:220px;width:100%;object-fit:cover;border-radius:12px;display:none}.counter{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
</style>
</head>
<body>
<main class="app"><div class="shell">
<section class="card" id="loginCard"><div class="head"><h1>Bienvenido</h1><p>Ingresa con tu usuario y contraseña.</p></div><div class="body"><form id="loginForm"><div class="field"><label>Usuario</label><input id="username" autocomplete="username" autocapitalize="none" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn" type="submit">Iniciar sesión</button></form><div id="loginMsg" class="msg muted"></div></div></section>
<section class="card hidden" id="homeCard"><div class="welcome"><div id="avatar" class="avatar">U</div><h2 id="welcomeName">Bienvenido</h2><p>Selecciona una opción para continuar.</p><div id="operatorInfo" class="operator"></div><button id="openSheets" class="menu-btn"><span class="menu-icon">📄</span><span><b>Subir hojas de servicio</b><br><span class="mini">Captura continua con fotografía obligatoria</span></span></button><div style="margin-top:18px"><button id="logoutBtn" class="btn secondary">Cerrar sesión</button></div></div></section>
<section class="card hidden" id="sheetCard"><div class="head"><div class="topbar"><div><h2>Subir hojas de servicio</h2><div class="mini" style="color:#bfdbfe">Captura continua de registros</div></div><span id="savedCounter" class="counter">0 guardados</span></div></div><div class="body"><div id="operatorCapture" class="operator"></div><form id="sheetForm"><div class="field"><label>Cliente</label><select id="client" required><option value="">Selecciona cliente</option></select></div><div class="field"><label>Origen</label><input id="origin" required></div><div class="field"><label>Destino</label><input id="destination" required></div><div class="field"><label>Tipo de movimiento</label><select id="movement" required><option value="">Selecciona tipo</option><option>IMPORTACIÓN</option><option>EXPORTACIÓN</option><option>CRUCE</option><option>FORÁNEO</option><option>MOVIMIENTO</option><option>OTRO</option></select></div><div class="field"><label>Fotografía de hoja de servicio</label><div class="photo-box"><input id="photo" type="file" accept="image/*" capture="environment" required><img id="preview" class="preview" alt="Vista previa"></div></div><button id="saveBtn" class="btn green" type="submit">Guardar y capturar siguiente</button></form><div id="sheetMsg" class="msg muted"></div><div class="actions"><button id="backHome" class="btn secondary" type="button">Inicio</button><button id="logoutBtn2" class="btn secondary" type="button">Cerrar sesión</button></div></div></section>
</div></main>
<script src="../profesional/assets/js/vendor/supabase-sdk.js"></script>
<script>
const SUPABASE_URL='https://nbogdhriavzqetnlrrau.supabase.co';
const SUPABASE_KEY='sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let ACCESS=null,SAVED=0;
const $=id=>document.getElementById(id);
function show(id){['loginCard','homeCard','sheetCard'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function setMsg(id,text,type='muted'){$(id).className='msg '+type;$(id).textContent=text||'';}
function internalEmail(user){return user.trim().toLowerCase()+'@usuarios.trafico-app.com';}
function initial(name){return ((name||'Usuario').trim()[0]||'U').toUpperCase();}
async function bootstrap(){const {data,error}=await sb.rpc('app_mobile_bootstrap');if(error||!data?.ok)throw new Error(error?.message||data?.error||'No se pudo validar el acceso.');ACCESS=data;if(!data.operadorId)throw new Error('Tu usuario todavía no está ligado a un operador.');renderHome();return data;}
function renderHome(){const n=ACCESS.nombre||ACCESS.username||'Usuario';$('welcomeName').textContent='Bienvenido, '+n;$('avatar').textContent=initial(n);$('operatorInfo').innerHTML='<b>Operador ligado</b><br>'+ACCESS.operadorNombre;$('operatorCapture').innerHTML='<b>Operador:</b> '+ACCESS.operadorNombre;const c=$('client');c.innerHTML='<option value="">Selecciona cliente</option>'+(ACCESS.clientes||[]).map(x=>'<option value="'+x.id+'">'+String(x.nombre).replace(/</g,'&lt;')+'</option>').join('');show('homeCard');}
async function logout(){await sb.auth.signOut();ACCESS=null;$('password').value='';show('loginCard');setMsg('loginMsg','Sesión cerrada.');}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;setMsg('loginMsg','Validando acceso…');try{const user=$('username').value.trim(),password=$('password').value;if(!/^[a-zA-Z0-9._-]{3,}$/.test(user))throw new Error('Usuario no válido.');const {error}=await sb.auth.signInWithPassword({email:internalEmail(user),password});if(error)throw new Error('Usuario o contraseña incorrectos.');await bootstrap();setMsg('loginMsg','');}catch(err){await sb.auth.signOut().catch(()=>{});setMsg('loginMsg',err.message||String(err),'error');}finally{$('loginBtn').disabled=false;}});
$('openSheets').onclick=()=>{show('sheetCard');$('origin').focus();};$('backHome').onclick=()=>show('homeCard');$('logoutBtn').onclick=logout;$('logoutBtn2').onclick=logout;
$('photo').addEventListener('change',()=>{const f=$('photo').files[0],p=$('preview');if(!f){p.style.display='none';p.src='';return;}p.src=URL.createObjectURL(f);p.style.display='block';});
$('sheetForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('saveBtn');btn.disabled=true;setMsg('sheetMsg','Guardando registro y fotografía…');try{const file=$('photo').files[0];if(!file)throw new Error('La fotografía es obligatoria.');const clientSel=$('client');const clienteId=clientSel.value,clienteNombre=clientSel.selectedOptions[0]?.textContent||'';const {data:u}=await sb.auth.getUser();const uid=u?.user?.id;if(!uid)throw new Error('Sesión no válida.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';const path=uid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;const {error:upErr}=await sb.storage.from('app-hojas-servicio').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||'image/jpeg'});if(upErr)throw upErr;const row={user_id:uid,operador_id:ACCESS.operadorId,operador_nombre:ACCESS.operadorNombre,cliente_id:clienteId,cliente_nombre:clienteNombre,origen:$('origin').value.trim(),destino:$('destination').value.trim(),tipo_movimiento:$('movement').value,foto_path:path};const {error:dbErr}=await sb.from('app_hojas_servicio_uploads').insert(row);if(dbErr){await sb.storage.from('app-hojas-servicio').remove([path]).catch(()=>{});throw dbErr;}SAVED++;$('savedCounter').textContent=SAVED+' guardado'+(SAVED===1?'':'s');setMsg('sheetMsg','Registro guardado. Puedes capturar el siguiente.','ok');$('sheetForm').reset();$('preview').style.display='none';$('preview').src='';$('origin').focus();}catch(err){setMsg('sheetMsg',err.message||String(err),'error');}finally{btn.disabled=false;}});
(async()=>{try{const {data}=await sb.auth.getSession();if(data?.session)await bootstrap();else show('loginCard');}catch(e){await sb.auth.signOut().catch(()=>{});show('loginCard');setMsg('loginMsg',e.message||String(e),'error');}})();
</script>
</body>
</html>
