      - name: Apply patch
        run: |
          echo '  nKXJldHVybiBmYWxzZTtpZihPYmplY3QucHJvdG90eXBlLmhhc093blByb3BlcnR5LmNhbGwobWF0cml6LGspKXJldHVybiAhIW1hdHJpeltrXTsvKiBMYSBmZWNoYSBmaW4gZXMgdmVuY2ltaWVudG8gcHJvZ3JhbWFkbywgbm8gc2FsaWRhIGF1dG9tw6F0aWNhLiAqL3JldHVybiBkYXRlPj1yLmZlY2hhSW5pY2lvO313aW5kb3cuY2NUb2dnbGVEY   d2luZG93LmNjU2FjYXJEZVJlbnRhPWZ1bmN0aW9uKGlkKXsKICBjb25zdCByPXJlbnRhcy5maW5kKHg9Pngu  xkaXYgc3R5bGU9InBhZGRpbmc6MTJweCAxNHB4O2JhY2tncm91bmQ6I2ZmZjdlZD   ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify and commit
        run: |
          grep -Fq 'VENCIDA · EN RENTA' app-correcta.html
          grep -Fq 'Fecha real de salida' app-correcta.html
          grep -Fq 'La fecha fin es vencimiento programado' app-correcta.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
