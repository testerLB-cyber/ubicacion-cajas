<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tráfico App · Comprobar anticipo</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0}.wrap{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden}header{background:#0f172a;color:#fff;padding:18px}main{padding:16px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{padding:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}.box small{display:block;color:#64748b}.box b{display:block;margin-top:3px}.form{margin-top:15px;padding-top:15px;border-top:1px solid #e2e8f0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;font-weight:800;color:#475569}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin-top:4px}textarea{min-height:65px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.success{background:#16a34a;color:#fff}.light{background:#e2e8f0;color:#334155}.danger{background:#fee2e2;color:#991b1b}.msg{padding:10px;border-radius:9px;margin-top:10px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.draft{border:1px solid #cbd5e1;border-radius:12px;padding:11px;margin:8px 0;background:#fff}.draft-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{font-size:10px;color:#64748b}.ocr{font-size:11px;color:#64748b;margin-top:6px}.sticky{position:sticky;bottom:0;background:#fff;padding-top:12px;border-top:1px solid #e2e8f0;margin-top:12px}@media(max-width:600px){.summary,.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><header><h2 style="margin:0">Comprobación de anticipo</h2><div id="folio"></div></header><main id="main">Cargando...</main></div></div>
<script>
const ENDPOINT="https://nbogdhriavzqetnlrrau.supabase.co/functions/v1/cc-anticipo-public",KEY="sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy",token=new URLSearchParams(location.search).get('t')||'';let A=null,drafts=[],OCR='';
const money=v=>Number(v||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
async function api(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Error');return j}
async function load(){try{const j=await api({action:'get',token});if(j.tipo!=='COMPROBACION')throw new Error('Este enlace no corresponde a comprobación.');A=j.anticipo;document.getElementById('folio').textContent=A.folio;const comprob=(j.comprobaciones||[]).reduce((s,x)=>s+Number(x.monto||0),0);document.getElementById('main').innerHTML='<div class="summary"><div class="box"><small>Operador</small><b>'+A.operador+'</b></div><div class="box"><small>Unidad</small><b>'+A.unidad+'</b></div><div class="box"><small>Destino</small><b>'+A.destino+'</b></div></div><div class="summary" style="margin-top:8px"><div class="box"><small>Entregado</small><b>'+money(A.montoEntregado)+'</b></div><div class="box"><small>Ya comprobado</small><b>'+money(comprob)+'</b></div><div class="box"><small>Pendiente actual</small><b>'+money(Math.max(0,A.montoEntregado-comprob))+'</b></div></div><div class="form"><h3>Capturar comprobante</h3><div class="grid"><div><label>Concepto</label><select id="concepto">'+A.detalles.map(x=>'<option value="'+x.concepto_id+'">'+x.concepto+'</option>').join('')+'</select></div><div><label>Tipo documento</label><select id="tipo"><option>TICKET</option><option>FACTURA</option><option>RECIBO</option><option>OTRO</option></select></div><div><label>Monto</label><input id="monto" type="number" step="0.01" min="0.01"></div><div><label>Folio</label><input id="folDoc"></div></div><div style="margin-top:10px"><label>Foto o PDF</label><input id="file" type="file" accept="image/*,application/pdf" capture="environment"><div id="ocr" class="ocr">Al seleccionar una foto intentaremos leer monto y descripción. Puedes corregir todo antes de agregarla.</div></div><div style="margin-top:10px"><label>Descripción / observaciones</label><textarea id="desc"></textarea></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" onclick="addDraft()">Agregar a comprobación</button><button class="btn light" onclick="resetForm()">Limpiar captura</button></div></div><div style="margin-top:18px"><h3>Borrador de comprobación</h3><div class="muted">Puedes editar o quitar cualquier registro. Nada se envía hasta presionar Guardar comprobación.</div><div id="drafts"></div><div class="sticky"><button class="btn success" id="saveAll" onclick="saveAll()">Guardar comprobación</button><div id="msg"></div></div></div><div style="margin-top:18px"><h3>Comprobantes ya guardados</h3><div id="saved">'+(j.comprobaciones||[]).map(x=>'<div class="draft">'+new Date(x.fecha).toLocaleDateString('es-MX')+' · '+x.concepto+'<b style="float:right">'+money(x.monto)+'</b><div class="muted">'+(x.origen==='ENLACE'?'Comprobado mediante enlace':'Captura interna')+'</div></div>').join('')+'</div></div>';document.getElementById('file').addEventListener('change',ocrFile);renderDrafts()}catch(e){document.getElementById('main').innerHTML='<div class="msg err">'+e.message+'</div>'}}
let currentFileData='',currentFileName='',currentMime='';
async function ocrFile(){const file=this.files[0],o=document.getElementById('ocr');OCR='';currentFileData='';currentFileName='';currentMime='';if(!file)return;currentFileData=await fileData(file);currentFileName=file.name;currentMime=file.type;if(file.type==='application/pdf'){o.textContent='PDF seleccionado. Captura monto y descripción manualmente.';return}try{o.textContent='Leyendo comprobante...';const r=await Tesseract.recognize(file,'spa+eng',{logger:x=>{if(x.status==='recognizing text')o.textContent='Leyendo comprobante '+Math.round((x.progress||0)*100)+'%'}});OCR=r.data.text||'';const lines=OCR.split(/\n/).map(x=>x.trim()).filter(Boolean);let amount=null;for(const line of lines){if(/total/i.test(line)){const nums=line.match(/\d+[\d,.]*\d|\d+/g);if(nums?.length)amount=Number(nums[nums.length-1].replace(/,/g,''))}}if(!amount){const nums=(OCR.match(/\b\d{1,6}[.,]\d{2}\b/g)||[]).map(x=>Number(x.replace(/,/g,''))).filter(Number.isFinite);if(nums.length)amount=Math.max(...nums)}if(amount)document.getElementById('monto').value=amount.toFixed(2);if(!document.getElementById('desc').value)document.getElementById('desc').value=lines.slice(0,3).join(' · ').slice(0,240);o.textContent='Lectura terminada. Revisa y corrige antes de agregar.'}catch(e){o.textContent='No pudimos leer automáticamente la imagen. Captura los datos manualmente.'}}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res('');const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(file)})}
function addDraft(){const monto=Number(document.getElementById('monto').value);if(!(monto>0)){alert('Captura el monto.');return}const c=document.getElementById('concepto');drafts.push({id:crypto.randomUUID(),conceptoId:c.value,concepto:c.options[c.selectedIndex].text,descripcion:document.getElementById('desc').value||c.options[c.selectedIndex].text,monto,tipoDocumento:document.getElementById('tipo').value,folioDocumento:document.getElementById('folDoc').value,fileData:currentFileData,fileName:currentFileName,mime:currentMime,ocrTexto:OCR,ocrMonto:monto,observaciones:''});resetForm();renderDrafts()}
function renderDrafts(){const el=document.getElementById('drafts');if(!el)return;el.innerHTML=drafts.length?drafts.map((d,i)=>'<div class="draft"><div class="draft-top"><strong>#'+(i+1)+' · '+d.concepto+'</strong><span>'+money(d.monto)+'</span></div><div class="muted">'+(d.fileName||'Sin archivo')+' · '+d.tipoDocumento+'</div><div style="display:flex;gap:7px;margin-top:8px"><button class="btn light" onclick="editDraft(\''+d.id+'\')">Editar</button><button class="btn danger" onclick="removeDraft(\''+d.id+'\')">Quitar</button></div></div>').join(''):'<div class="muted" style="padding:10px 0">Todavía no has agregado comprobantes al borrador.</div>';document.getElementById('saveAll').disabled=!drafts.length}
function editDraft(id){const d=drafts.find(x=>x.id===id);if(!d)return;const c=document.getElementById('concepto');c.value=d.conceptoId;document.getElementById('tipo').value=d.tipoDocumento;document.getElementById('monto').value=d.monto;document.getElementById('folDoc').value=d.folioDocumento||'';document.getElementById('desc').value=d.descripcion||'';currentFileData=d.fileData||'';currentFileName=d.fileName||'';currentMime=d.mime||'';OCR=d.ocrTexto||'';drafts=drafts.filter(x=>x.id!==id);renderDrafts();window.scrollTo({top:260,behavior:'smooth'})}
function removeDraft(id){drafts=drafts.filter(x=>x.id!==id);renderDrafts()}
function resetForm(){document.getElementById('monto').value='';document.getElementById('folDoc').value='';document.getElementById('desc').value='';document.getElementById('file').value='';document.getElementById('ocr').textContent='Listo para capturar otro comprobante.';OCR='';currentFileData='';currentFileName='';currentMime=''}
async function saveAll(){const msg=document.getElementById('msg');if(!drafts.length)return;const btn=document.getElementById('saveAll');btn.disabled=true;try{await api({action:'proof_batch',token,items:drafts});msg.className='msg ok';msg.textContent='Comprobación guardada correctamente. Se enviaron '+drafts.length+' comprobante(s).';drafts=[];setTimeout(load,700)}catch(e){msg.className='msg err';msg.textContent=e.message;btn.disabled=false}}
load();
</script></body></html>
