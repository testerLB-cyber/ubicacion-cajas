name: Aplicar Hojas Excel v8

on:
  push:
    branches: [ main ]
    paths:
      - 'profesional/assets/js/modules/service-sheets-excel-v8.js'
      - 'profesional/assets/js/modules/service-sheets-comprobacion-v9.js'
      - '.github/workflows/apply-service-sheets-excel-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Insertar módulos Hojas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text(encoding='utf-8')
          tag8='<script src="assets/js/modules/service-sheets-excel-v8.js?v=v8"></script>'
          if tag8 not in s:
              anchor='<script src="assets/js/modules/service-sheets-person-v7.js?v=person-v7"></script>'
              if anchor not in s:
                  anchor='<script src="assets/js/modules/service-sheets-person-v7.js"></script>'
              if anchor not in s:
                  raise SystemExit('No se encontró service-sheets-person-v7.js')
              s=s.replace(anchor,anchor+'\n'+tag8,1)
          tag9='<script src="assets/js/modules/service-sheets-comprobacion-v9.js?v=v9"></script>'
          if tag9 not in s:
              if tag8 not in s:
                  raise SystemExit('No se encontró módulo Excel v8')
              s=s.replace(tag8,tag8+'\n'+tag9,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar JavaScript
        run: |
          node --check profesional/assets/js/modules/service-sheets-excel-v8.js
          node --check profesional/assets/js/modules/service-sheets-comprobacion-v9.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Activar comprobación Hojas v9"
            git push
          fi
