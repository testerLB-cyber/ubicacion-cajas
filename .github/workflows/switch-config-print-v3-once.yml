name: Switch config print v3 once
on:
  push:
    paths:
      - '.github/workflows/switch-config-print-v3-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Switch isolated print module to v3
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text()
          old='<script src="assets/js/modules/configuracion-impresion-v2.js?v=20260913-0125"></script>'
          new='<script src="assets/js/modules/configuracion-impresion-v3.js?v=20260913-0133"></script>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              anchor='<script id="gm-sidebar-cajas-js" src="assets/js/ui/app-navigation.js"></script>'
              s=s.replace(anchor,new+'\n'+anchor,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Configuración: activar Impresión QR v3 sin referencias nulas'
          git push origin HEAD:main