name: Aplicar Anticipos ERP seguro

on:
  workflow_dispatch:
  push:
    paths:
      - 'profesional/assets/js/modules/anticipos-v13-erp-catalogos.js'
      - '.github/workflows/apply-anticipos-v13-erp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Consolidar una sola carga ERP despues de Auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('profesional/index.html')
          t=p.read_text(encoding='utf-8')
          auth='<script id="cc-auth-security-js" src="assets/js/security/auth-permissions.js"></script>'
          tag='<script src="assets/js/modules/anticipos-v13-erp-catalogos.js?v=v14-safe"></script>'

          if auth not in t:
              raise SystemExit('No se encontro auth-permissions.js; publicacion cancelada')

          # Quitar cualquier version/duplicado previo del modulo ERP.
          t=re.sub(r'\s*<script src="assets/js/modules/anticipos-v13-erp-catalogos\.js\?v=[^"]+"></script>\s*', '\n', t)

          # Insertar exactamente una vez despues de Auth.
          t=t.replace(auth, auth+'\n'+tag, 1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Validar sintaxis orden y unicidad
        run: |
          node --check profesional/assets/js/modules/anticipos-v13-erp-catalogos.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('profesional/index.html').read_text(encoding='utf-8')
          js=Path('profesional/assets/js/modules/anticipos-v13-erp-catalogos.js').read_text(encoding='utf-8')
          auth='<script id="cc-auth-security-js" src="assets/js/security/auth-permissions.js"></script>'
          matches=re.findall(r'<script src="assets/js/modules/anticipos-v13-erp-catalogos\.js\?v=[^"]+"></script>',html)
          if len(matches)!=1:
              raise SystemExit(f'Debe existir una sola carga ERP; encontradas {len(matches)}')
          tag=matches[0]
          if html.index(tag)<=html.index(auth):
              raise SystemExit('ERP quedo antes de Auth; publicacion cancelada')
          required=['Inicialización segura','cc_ant_catalog_action','cc_ant_util_list','function bootSafe()']
          missing=[x for x in required if x not in js]
          if missing:
              raise SystemExit('Faltan protecciones/contratos: '+', '.join(missing))
          print('OK: una sola carga ERP v14, despues de Auth, sintaxis valida e inicializacion segura')
          PY

      - name: Publicar cambio validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/index.html
          if git diff --cached --quiet; then
            echo "Carga ERP ya estaba consolidada correctamente"
          else
            git commit -m "Consolidar Anticipos ERP v14 seguro despues de Auth"
            git push origin main
          fi
