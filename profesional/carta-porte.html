<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartas Porte · Tráfico App</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config/supabase-config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:Arial,sans-serif}.top{background:#0f172a;color:white;padding:18px 24px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{font-size:12px;font-weight:700}input,select,textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #cbd5e1;border-radius:9px}.row{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:12px;margin:8px 0}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.badge{background:#fef3c7;color:#92400e;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:bold}.msg{padding:10px;border-radius:9px;margin:10px 0}.bad{background:#fef2f2;color:#991b1b}.good{background:#ecfdf5;color:#065f46}.actions{display:flex;gap:8px;justify-content:flex-end}.hide{display:none}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="top"><div><b>Cartas Porte</b><div style="font-size:12px;color:#cbd5e1">CFDI 4.0 · Carta Porte 3.1 · Autotransporte</div></div><span class="badge">BORRADOR · SIN TIMBRAR</span></div><main class="wrap">
<div style="display:flex;gap:8px;margin-bottom:14px"><button class="primary" onclick="view('edit')">Nueva Carta Porte</button><button class="secondary" onclick="view('history');loadHistory()">Historial</button><button class="secondary" onclick="location.href='./'">Volver</button></div>
<section id="edit">
<div class="card"><h3>1 · Datos generales</h3><div class="grid"><label>Tipo CFDI<select id="tipo"><option value="I">Ingreso</option><option value="T">Traslado</option></select></label><label>Transporte internacional<select id="intl" onchange="intlBox.classList.toggle('hide',this.value==='false')"><option value="false">No</option><option value="true">Sí</option></select></label><div id="intlBox" class="hide" style="display:contents"><label>Entrada / salida<input id="entrada"></label><label>País origen/destino<input id="pais"></label></div><label>Distancia total km<input id="dist" type="number" step=".01"></label><label style="grid-column:span 2">Observaciones<textarea id="obs"></textarea></label></div></div>
<div class="card"><h3>2 · Emisor y receptor</h3><div class="grid"><label>RFC emisor<input id="erfc"></label><label>Nombre emisor<input id="enom"></label><label>RFC receptor<input id="rrfc"></label><label>Nombre receptor<input id="rnom"></label></div></div>
<div class="card"><h3>3 · Ubicaciones</h3><div id="ubis"></div><button class="secondary" onclick="addUbi()">+ Ubicación</button></div>
<div class="card"><h3>4 · Mercancías</h3><div id="mercs"></div><button class="secondary" onclick="addMerc()">+ Mercancía</button></div>
<div class="card"><h3>5 · Autotransporte y seguro</h3><div class="grid"><label>Permiso SICT<input id="perm"></label><label>Núm. permiso SICT<input id="nperm"></label><label>Configuración vehicular<input id="config"></label><label>Placa VM<input id="placa"></label><label>Año modelo<input id="anio" type="number"></label><label>Peso bruto vehicular<input id="pbv" type="number" step=".001"></label><label>Aseguradora RC<input id="aseg"></label><label>Póliza RC<input id="pol"></label></div></div>
<div class="card"><h3>6 · Remolques</h3><div id="rems"></div><button class="secondary" onclick="addRem()">+ Remolque</button></div>
<div class="card"><h3>7 · Figuras de transporte</h3><div id="figs"></div><button class="secondary" onclick="addFig()">+ Figura</button></div>
<div id="msg"></div><div class="actions"><button class="secondary" onclick="validateForm()">Validar</button><button class="primary" onclick="save()">Guardar borrador</button></div></section>
<section id="history" class="hide"><div class="card"><h3>Historial</h3><div id="historyBody">Cargando…</div></div></section></main>
<script>
const db=supabase.createClient(window.GM_SUPABASE_URL,window.GM_SUPABASE_ANON_KEY);let cartaId=null;
function view(x){edit.classList.toggle('hide',x!=='edit');history.classList.toggle('hide',x!=='history')}
function box(html,cl){let d=document.createElement('div');d.className='row '+cl;d.innerHTML=html+'<button class="danger" onclick="this.parentElement.remove()">Quitar</button>';return d}
function addUbi(t='Origen'){ubis.appendChild(box('<div class="grid"><label>Tipo<select class="ut"><option '+(t==='Origen'?'selected':'')+'>Origen</option><option '+(t==='Destino'?'selected':'')+'>Destino</option></select></label><label>RFC<input class="ur"></label><label>Nombre<input class="un"></label><label>Fecha/hora<input class="uf" type="datetime-local"></label><label>Distancia km<input class="ud" type="number" step=".01"></label><label>Código postal<input class="ucp"></label><label>Estado<input class="ue"></label><label>Municipio<input class="um"></label><label>Localidad<input class="ul"></label><label>Colonia<input class="uco"></label><label>Calle<input class="uca"></label><label>Núm. exterior<input class="une"></label></div>','ubi'))}
function addMerc(){mercs.appendChild(box('<div class="grid"><label>BienesTransp SAT<input class="mb"></label><label>Descripción<input class="md"></label><label>Cantidad<input class="mc" type="number" step=".000001"></label><label>Clave unidad<input class="mu"></label><label>Peso kg<input class="mp" type="number" step=".000001"></label><label>Material peligroso<select class="mmp"><option value="">No aplica</option><option>Sí</option><option>No</option></select></label><label>Clave material peligroso<input class="mcmp"></label><label>Embalaje<input class="me"></label><label>Fracción arancelaria<input class="mfa"></label><label>Valor mercancía<input class="mv" type="number" step=".01"></label><label>Moneda<input class="mmo" value="MXN"></label></div>','merc'))}
function addRem(){rems.appendChild(box('<div class="grid"><label>Subtipo remolque<input class="rs"></label><label>Placa<input class="rp"></label></div>','rem'))}
function addFig(){figs.appendChild(box('<div class="grid"><label>Tipo figura<input class="ft" placeholder="01 Operador"></label><label>RFC<input class="fr"></label><label>Nombre<input class="fn"></label><label>Núm. licencia<input class="fl"></label><label>Residencia fiscal<input class="fres"></label></div>','fig'))}
function arr(s,f){return [...document.querySelectorAll(s)].map(f)}
function errs(){let e=[];if(!erfc.value)e.push('RFC emisor');if(!rrfc.value)e.push('RFC receptor');let u=document.querySelectorAll('.ubi');if(![...u].some(x=>x.querySelector('.ut').value==='Origen'))e.push('Origen');if(![...u].some(x=>x.querySelector('.ut').value==='Destino'))e.push('Destino');if(!document.querySelector('.merc'))e.push('Mercancía');if(!perm.value||!nperm.value||!config.value||!placa.value)e.push('Datos completos de autotransporte');if(!document.querySelector('.fig'))e.push('Figura de transporte');if(intl.value==='true'&&(!entrada.value||!pais.value))e.push('Datos de transporte internacional');return e}
function validateForm(){let e=errs();msg.className='msg '+(e.length?'bad':'good');msg.innerHTML=e.length?'Faltan: '+e.join(', '):'Validación operativa V1 correcta. Aún no es validación PAC.'}
async function save(){let e=errs();if(e.length){validateForm();return}let u=(await db.auth.getUser()).data.user;if(!u){msg.className='msg bad';msg.textContent='Inicia sesión en Tráfico App para guardar.';return}let h={tipo_cfdi:tipo.value,transporte_internacional:intl.value==='true',entrada_salida_merc:entrada.value||null,pais_origen_destino:pais.value||null,total_dist_rec:+dist.value||null,emisor:{rfc:erfc.value,nombre:enom.value},receptor:{rfc:rrfc.value,nombre:rnom.value},autotransporte:{perm_sct:perm.value,num_permiso_sct:nperm.value,config_vehicular:config.value,placa_vm:placa.value,anio_modelo:+anio.value||null,peso_bruto_vehicular:+pbv.value||null},seguros:{asegura_resp_civil:aseg.value,poliza_resp_civil:pol.value},observaciones:obs.value};let q=cartaId?db.from('cp_cartas').update(h).eq('id',cartaId).select().single():db.from('cp_cartas').insert(h).select().single();let z=await q;if(z.error){msg.className='msg bad';msg.textContent=z.error.message;return}cartaId=z.data.id;await Promise.all(['cp_ubicaciones','cp_mercancias','cp_remolques','cp_figuras'].map(t=>db.from(t).delete().eq('carta_id',cartaId)));
let U=arr('.ubi',(x,i)=>({carta_id:cartaId,orden:i+1,tipo:x.querySelector('.ut').value,rfc_remitente_destinatario:x.querySelector('.ur').value,nombre_remitente_destinatario:x.querySelector('.un').value,fecha_hora_salida_llegada:x.querySelector('.uf').value||null,distancia_recorrida:+x.querySelector('.ud').value||null,domicilio:{codigo_postal:x.querySelector('.ucp').value,estado:x.querySelector('.ue').value,municipio:x.querySelector('.um').value,localidad:x.querySelector('.ul').value,colonia:x.querySelector('.uco').value,calle:x.querySelector('.uca').value,num_exterior:x.querySelector('.une').value}}));let M=arr('.merc',(x,i)=>({carta_id:cartaId,orden:i+1,bienes_transp:x.querySelector('.mb').value,descripcion:x.querySelector('.md').value,cantidad:+x.querySelector('.mc').value||null,clave_unidad:x.querySelector('.mu').value,peso_kg:+x.querySelector('.mp').value||null,material_peligroso:x.querySelector('.mmp').value||null,cve_material_peligroso:x.querySelector('.mcmp').value||null,embalaje:x.querySelector('.me').value||null,fraccion_arancelaria:x.querySelector('.mfa').value||null,valor_mercancia:+x.querySelector('.mv').value||null,moneda:x.querySelector('.mmo').value||null}));let R=arr('.rem',x=>({carta_id:cartaId,subtipo_rem:x.querySelector('.rs').value,placa:x.querySelector('.rp').value})).filter(x=>x.subtipo_rem&&x.placa);let F=arr('.fig',x=>({carta_id:cartaId,tipo_figura:x.querySelector('.ft').value,rfc_figura:x.querySelector('.fr').value,nombre_figura:x.querySelector('.fn').value,num_licencia:x.querySelector('.fl').value,residencia_fiscal:x.querySelector('.fres').value})).filter(x=>x.tipo_figura);for(let [t,a] of [['cp_ubicaciones',U],['cp_mercancias',M],['cp_remolques',R],['cp_figuras',F]])if(a.length){let r=await db.from(t).insert(a);if(r.error){msg.className='msg bad';msg.textContent=r.error.message;return}}msg.className='msg good';msg.textContent='Borrador guardado: '+z.data.folio_interno}
async function loadHistory(){let r=await db.from('cp_cartas').select('folio_interno,tipo_cfdi,transporte_internacional,estatus,created_at').order('created_at',{ascending:false}).limit(100);if(r.error){historyBody.textContent=r.error.message;return}historyBody.innerHTML='<table><tr><th>Folio</th><th>Tipo</th><th>Internacional</th><th>Estatus</th><th>Fecha</th></tr>'+r.data.map(x=>'<tr><td>'+x.folio_interno+'</td><td>'+x.tipo_cfdi+'</td><td>'+(x.transporte_internacional?'Sí':'No')+'</td><td>'+x.estatus+'</td><td>'+new Date(x.created_at).toLocaleString()+'</td></tr>').join('')+'</table>'}
addUbi('Origen');addUbi('Destino');addMerc();addFig();</script></body></html>
