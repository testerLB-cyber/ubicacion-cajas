<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tráfico App · Comprobación completa</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0}.wrap{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 12px 35px rgba(15,23,42,.08)}header{background:#0f172a;color:#fff;padding:18px}header h2{margin:0}.sub{font-size:11px;color:#cbd5e1;margin-top:4px}main{padding:16px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{padding:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}.box small{display:block;color:#64748b;font-size:10px;font-weight:800}.box b{display:block;margin-top:3px}.form{margin-top:15px;padding-top:15px;border-top:1px solid #e2e8f0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;font-weight:800;color:#475569}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin-top:4px}textarea{min-height:70px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.success{background:#16a34a;color:#fff}.light{background:#e2e8f0;color:#334155}.danger{background:#fee2e2;color:#991b1b}.msg{padding:10px;border-radius:9px;margin-top:10px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.draft{border:1px solid #cbd5e1;border-radius:12px;padding:11px;margin:8px 0;background:#fff}.draft-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{font-size:10px;color:#64748b}.sticky{position:sticky;bottom:0;background:#fff;padding-top:12px;border-top:1px solid #e2e8f0;margin-top:12px}@media(max-width:600px){.summary,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header><h2>Comprobación completa de anticipo</h2><div class="sub" id="folio">Validando enlace...</div></header>
<main id="main">Cargando...</main>
</div></div>
<script>
const ENDPOINT="https://nbogdhriavzqetnlrrau.supabase.co/functions/v1/cc-anticipo-public";
const KEY="sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy";
const token=new URLSearchParams(location.search).get('t')||'';
let A=null,drafts=[];
const money=v=>Number(v||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
async function api(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Error');return j}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res('');const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(file)})}
async function load(){
 try{
  const j=await api({action:'get',token});
  if(j.tipo!=='COMPROBACION')throw new Error('Este enlace no corresponde a comprobación.');
  A=j.anticipo;document.getElementById('folio').textContent=(A.folio||'')+' · '+(A.operador||'');
  const comprob=(j.comprobaciones||[]).reduce((s,x)=>s+Number(x.monto||0),0);
  const opts=(A.detalles||[]).map(x=>'<option value="'+x.concepto_id+'">'+x.concepto+'</option>').join('');
  document.getElementById('main').innerHTML=
  '<div class="summary"><div class="box"><small>OPERADOR</small><b>'+A.operador+'</b></div><div class="box"><small>UNIDAD</small><b>'+A.unidad+'</b></div><div class="box"><small>DESTINO</small><b>'+A.destino+'</b></div></div>'+
  '<div class="summary" style="margin-top:8px"><div class="box"><small>ENTREGADO</small><b>'+money(A.montoEntregado)+'</b></div><div class="box"><small>YA COMPROBADO</small><b>'+money(comprob)+'</b></div><div class="box"><small>PENDIENTE</small><b>'+money(Math.max(0,A.montoEntregado-comprob))+'</b></div></div>'+
  '<div class="form"><h3>Capturar comprobante</h3><div class="grid"><div><label>Concepto *</label><select id="concepto">'+opts+'</select></div><div><label>Importe total *</label><input id="monto" type="number" min="0.01" step="0.01"></div><div><label>Tipo documento</label><select id="tipo"><option>TICKET</option><option>FACTURA</option><option>RECIBO</option><option>OTRO</option></select></div><div><label>Folio</label><input id="folDoc"></div></div><div style="margin-top:10px"><label>Foto o PDF <span class="muted">(opcional)</span></label><input id="file" type="file" accept="image/*,application/pdf"></div><div style="margin-top:10px"><label>Descripción / artículos / observaciones</label><textarea id="desc"></textarea></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" onclick="addDraft()">Agregar comprobante</button><button class="btn light" onclick="resetForm()">Limpiar</button></div></div>'+
  '<div style="margin-top:18px"><h3>Comprobantes por guardar</h3><div class="muted">Puedes agregar varios. Nada se guarda hasta presionar Guardar comprobación.</div><div id="drafts"></div><div class="sticky"><button class="btn success" id="saveAll" onclick="saveAll()">Guardar comprobación</button><div id="msg"></div></div></div>'+
  '<div style="margin-top:18px"><h3>Comprobantes ya guardados</h3><div id="saved">'+(j.comprobaciones||[]).map(x=>'<div class="draft">'+new Date(x.fecha).toLocaleDateString('es-MX')+' · '+x.concepto+'<b style="float:right">'+money(x.monto)+'</b></div>').join('')+'</div></div>';
  renderDrafts();
 }catch(e){document.getElementById('main').innerHTML='<div class="msg err">'+e.message+'</div>'}
}
async function addDraft(){
 const c=document.getElementById('concepto'),monto=Number(document.getElementById('monto').value),file=document.getElementById('file').files[0];
 if(!c||!c.value){alert('Selecciona un concepto.');return}
 if(!(monto>0)){alert('Captura el importe total.');return}
 const data=file?await fileData(file):'';
 drafts.push({
   conceptoId:c.value,concepto:c.options[c.selectedIndex].text,
   descripcion:document.getElementById('desc').value||c.options[c.selectedIndex].text,
   monto,tipoDocumento:document.getElementById('tipo').value,
   folioDocumento:document.getElementById('folDoc').value||'',
   fileData:data,fileName:file?.name||'',mime:file?.type||'',
   ocrTexto:'',ocrMonto:'',observaciones:'Captura mediante enlace completo'
 });
 resetForm();renderDrafts();
}
function renderDrafts(){
 const el=document.getElementById('drafts');if(!el)return;
 el.innerHTML=drafts.length?drafts.map((d,i)=>'<div class="draft"><div class="draft-top"><strong>#'+(i+1)+' · '+d.concepto+'</strong><b>'+money(d.monto)+'</b></div><div class="muted">'+(d.fileName||'Sin archivo')+' · '+d.tipoDocumento+'</div><div style="margin-top:7px"><button class="btn danger" onclick="removeDraft('+i+')">Quitar</button></div></div>').join(''):'<div class="muted" style="padding:10px 0">Todavía no has agregado comprobantes.</div>';
 const b=document.getElementById('saveAll');if(b)b.disabled=!drafts.length;
}
function removeDraft(i){drafts.splice(i,1);renderDrafts()}
function resetForm(){['monto','folDoc','desc','file'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''})}
async function saveAll(){
 const msg=document.getElementById('msg'),btn=document.getElementById('saveAll');if(!drafts.length)return;
 try{
  btn.disabled=true;
  await api({action:'proof_batch',token,items:drafts});
  msg.className='msg ok';msg.textContent='Comprobación guardada correctamente. Se registraron '+drafts.length+' comprobante(s).';
  drafts=[];setTimeout(load,700);
 }catch(e){msg.className='msg err';msg.textContent=e.message||String(e);btn.disabled=false}
}
load();
</script>
</body></html>
