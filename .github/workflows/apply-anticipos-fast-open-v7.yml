name: Optimizar apertura Nuevo anticipo v7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_anticipos_fast_open_v7.py'
      - '.github/workflows/apply-anticipos-fast-open-v7.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar apertura inmediata
        run: python3 .github/scripts/fix_anticipos_fast_open_v7.py
      - name: Validar
        run: |
          grep -q 'Nuevo anticipo apertura inmediata v7' profesional/assets/js/modules/anticipos-profesional-flow.js
          grep -q 'anticipos-profesional-flow.js?v=fast-open-v7' profesional/index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Acelerar apertura de Nuevo anticipo"
          git push