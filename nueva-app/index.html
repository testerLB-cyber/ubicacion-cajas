<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi App">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mi App</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#dbeafe 0,#eff6ff 28%,#f8fafc 60%)}
    .app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(22px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom))}
    .card{width:min(430px,100%);background:rgba(255,255,255,.94);border:1px solid rgba(148,163,184,.28);border-radius:28px;box-shadow:0 28px 80px rgba(15,23,42,.13);overflow:hidden}
    .head{padding:28px 24px 24px;background:linear-gradient(145deg,#0f172a,#1e3a8a);color:#fff}.brand{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:25px;margin-bottom:18px}.head h1{margin:0;font-size:28px;letter-spacing:-.03em}.head p{margin:7px 0 0;color:#bfdbfe;font-size:13px}
    .body{padding:24px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}.field input{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:14px 15px;font-size:16px;outline:none;background:#fff}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
    .btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}.btn:disabled{opacity:.6}.msg{min-height:21px;margin:12px 2px 0;font-size:12px;font-weight:700}.error{color:#b91c1c}.ok{color:#166534}.muted{color:#64748b}
    .welcome{display:none;text-align:center;padding:32px 24px 26px}.avatar{width:88px;height:88px;border-radius:26px;margin:0 auto 18px;background:linear-gradient(145deg,#2563eb,#1e40af);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:0 16px 40px rgba(37,99,235,.25)}.welcome h2{font-size:27px;margin:0;letter-spacing:-.03em}.welcome p{color:#64748b;margin:8px 0 26px}.logout{background:#e2e8f0;color:#334155}.small{font-size:11px;color:#94a3b8;margin-top:18px;line-height:1.45}
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div id="loginView">
        <div class="head"><div class="brand">↗</div><h1>Bienvenido</h1><p>Ingresa con el usuario asignado desde Tráfico App.</p></div>
        <div class="body">
          <form id="loginForm">
            <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required></div>
            <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
            <button id="loginBtn" class="btn" type="submit">Iniciar sesión</button>
          </form>
          <div id="loginMsg" class="msg muted"></div>
          <div class="small">El acceso se controla desde la opción <b>Usuarios App</b> en la aplicación web principal.</div>
        </div>
      </div>
      <div id="welcomeView" class="welcome">
        <div id="avatar" class="avatar">U</div>
        <h2 id="welcomeName">Bienvenido</h2>
        <p>Tu sesión está activa. Esta será la pantalla inicial de la nueva aplicación.</p>
        <button id="logoutBtn" class="btn logout" type="button">Cerrar sesión</button>
      </div>
    </section>
  </main>

  <script src="../profesional/assets/js/vendor/supabase-sdk.js"></script>
  <script>
    const SUPABASE_URL='https://nbogdhriavzqetnlrrau.supabase.co';
    const SUPABASE_KEY='sb_publishable_B_qEegIG45rnH1xuXEDyBA_DZnwn3yy';
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const loginView=document.getElementById('loginView'),welcomeView=document.getElementById('welcomeView'),msg=document.getElementById('loginMsg'),btn=document.getElementById('loginBtn');

    function setMsg(text,type='muted'){msg.className='msg '+type;msg.textContent=text||'';}
    function initial(name){const n=(name||'Usuario').trim();return (n[0]||'U').toUpperCase();}
    function showWelcome(access){
      loginView.style.display='none';welcomeView.style.display='block';
      const name=access?.nombre||access?.email||'Usuario';
      document.getElementById('welcomeName').textContent='Bienvenido, '+name;
      document.getElementById('avatar').textContent=initial(name);
    }
    function showLogin(){welcomeView.style.display='none';loginView.style.display='block';}
    async function validateAccess(){
      const {data,error}=await sb.rpc('cc_my_access');
      if(error||!data?.ok)throw new Error(error?.message||data?.error||'No se pudo validar el acceso.');
      if(data.activo!==true)throw new Error('Tu usuario está desactivado.');
      const allowed=data.rol==='ADMIN'||data?.permisos?.app_movil?.ver===true;
      if(!allowed)throw new Error('Tu usuario no tiene acceso habilitado para esta aplicación.');
      showWelcome(data);return data;
    }

    document.getElementById('loginForm').addEventListener('submit',async e=>{
      e.preventDefault();btn.disabled=true;setMsg('Validando acceso…');
      try{
        const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        await validateAccess();setMsg('');
      }catch(e){await sb.auth.signOut().catch(()=>{});showLogin();setMsg(e.message||String(e),'error');}
      finally{btn.disabled=false;}
    });
    document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();document.getElementById('password').value='';showLogin();setMsg('Sesión cerrada.');});

    (async()=>{
      try{const {data}=await sb.auth.getSession();if(data?.session)await validateAccess();else showLogin();}
      catch(e){await sb.auth.signOut().catch(()=>{});showLogin();setMsg(e.message||String(e),'error');}
    })();
  </script>
</body>
</html>
