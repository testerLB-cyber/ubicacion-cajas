name: Aplicar Anticipos v17 Catalogos Integrados

on:
  workflow_dispatch:
  push:
    paths:
      - 'profesional/assets/js/modules/anticipos-v17-catalogos-inline-lock.js'
      - '.github/workflows/apply-anticipos-v17-inline-catalogos.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insertar bloqueo inline v17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          t=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/modules/anticipos-v17-catalogos-inline-lock.js?v=v17"></script>'
          t='\n'.join(x for x in t.splitlines() if 'anticipos-v17-catalogos-inline-lock.js' not in x)+'\n'
          anchor='<script src="assets/js/modules/anticipos-v16-cajas.js?v=v16"></script>'
          if anchor not in t:
              raise SystemExit('No se encontro Anticipos v16')
          t=t.replace(anchor,anchor+'\n'+tag)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check profesional/assets/js/modules/anticipos-v17-catalogos-inline-lock.js
          test "$(grep -c 'anticipos-v17-catalogos-inline-lock.js' profesional/index.html)" = "1"
          grep -q 'stopImmediatePropagation' profesional/assets/js/modules/anticipos-v17-catalogos-inline-lock.js
          grep -q 'ccAntOpenERPCatalogs' profesional/assets/js/modules/anticipos-v17-catalogos-inline-lock.js
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/index.html
          if git diff --cached --quiet; then
            echo "v17 ya insertado"
          else
            git commit -m "Abrir Catalogos de Anticipos solo como vista integrada"
            git push origin main
          fi
