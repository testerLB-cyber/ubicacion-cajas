name: Aplicar Anticipos v27 Pendientes separados

on:
  push:
    branches: [ main ]
    paths:
      - 'profesional/assets/js/modules/anticipos-v27-pendientes-separados.js'
      - '.github/workflows/apply-anticipos-v27-pendientes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Insertar módulo v27
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/modules/anticipos-v27-pendientes-separados.js?v=v27"></script>'
          if tag not in s:
              anchors=[
                '<script src="assets/js/modules/anticipos-v26-operador-buscable.js?v=v26"></script>',
                '<script src="assets/js/modules/anticipos-v25-movimientos-caja-unico.js?v=v25"></script>',
                '<script src="assets/js/modules/anticipos-v24-catalogos-listado-beneficiarios.js?v=v24"></script>'
              ]
              anchor=next((a for a in anchors if a in s),None)
              if not anchor: raise SystemExit('No se encontró ancla de Anticipos')
              s=s.replace(anchor,anchor+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validar JavaScript
        run: node --check profesional/assets/js/modules/anticipos-v27-pendientes-separados.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Activar Anticipos v27 pendientes separados"
            git push
          fi
