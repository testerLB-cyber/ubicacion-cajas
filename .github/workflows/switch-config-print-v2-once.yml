name: Switch config print v2 once
on:
  push:
    paths:
      - '.github/workflows/switch-config-print-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Switch isolated print module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text()
          old='<script src="assets/js/modules/configuracion-impresion-qr-persist-v1.js?v=20260913-0118"></script>'
          s=s.replace(old,'')
          tag='<script src="assets/js/modules/configuracion-impresion-v2.js?v=20260913-0125"></script>'
          anchor='<script id="gm-sidebar-cajas-js" src="assets/js/ui/app-navigation.js"></script>'
          if tag not in s:
              s=s.replace(anchor,tag+'\n'+anchor,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profesional/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Configuración: activar módulo aislado de Impresión QR v2'
          git push origin HEAD:main