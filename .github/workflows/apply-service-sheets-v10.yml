name: Aplicar Control Hojas v10

on:
  push:
    branches: [ main ]
    paths:
      - 'profesional/assets/js/modules/service-sheets-control-v10.js'
      - '.github/workflows/apply-service-sheets-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Activar módulo v10
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profesional/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/modules/service-sheets-control-v10.js?v=v10"></script>'
          if tag not in s:
              anchors=[
                '<script src="assets/js/modules/service-sheets-comprobacion-v9.js?v=v9"></script>',
                '<script src="assets/js/modules/service-sheets-excel-v8.js?v=v8"></script>',
                '<script src="assets/js/modules/service-sheets-person-v7.js?v=person-v7"></script>'
              ]
              for a in anchors:
                  if a in s:
                      s=s.replace(a,a+'\n'+tag,1)
                      break
              else:
                  raise SystemExit('No se encontró ancla de Hojas')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validar JavaScript
        run: node --check profesional/assets/js/modules/service-sheets-control-v10.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profesional/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Activar Control de Hojas v10"
            git push
          fi
